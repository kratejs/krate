[workspace]
members = ["wasm", "builder"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

# docfind — Microsoft's WASM document search engine (https://github.com/microsoft/docfind).
# Vendored so krate can build a search index with the index embedded into a WASM
# module entirely in-process (no subprocess, no temp JSON file).
#
# Upstream layout: core/ (index building + search) + cli/ (build tool). Krate does
# not shell out to the cli; instead the cli's index-embedding logic was moved into
# the `wasm` crate and exposed as plain C-ABI exports so the embedded WASM module
# can be driven from Go via a WebAssembly runtime. See wasm/src/lib.rs.
