name: CI

# Pull requests run a fast set; pushes to dev and main, the nightly schedule
# and manual runs are full runs. .github/scripts/ci-scope.mjs decides which
# Krate Native runners a pull request needs (it path-filters them) and whether
# a run is a full one. What a pull request skips, and where it runs instead:
#   - packaging, install, update and signing smoke tests on every OS, the
#     Flatpak and snap builds, the docs site as a native app: full runs.
#   - the Wayland GUI pass, the native size and memory budgets, the memory
#     reports, the native plugin tests on macOS and Windows: full runs.
#   - the repeated GUI pass (a flake check): nightly and manual runs.
#   - the two arm64 native runners run a thin smoke set on pull requests and
#     everything on full runs.
#   - the Go tests run in shards (.github/scripts/go-test-shards.mjs), so test
#     results are not reused across runs; compiled packages still come from
#     the shared build cache saved by shard 0. Full runs pass -count=1.
#
# Go test shard counts: Linux race 3 (go-test), Windows 2 and macOS 1
# (go-matrix). They are sized for the GitHub Free plan's 20 concurrent jobs, 5
# of them macOS: more shards queue behind each other and make a run slower.
# Raise them in those two matrices (shard indexes and the shards value) once
# the concurrency limit is raised.

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

# A new commit cancels a pull request's run in progress. Pushes to dev and main
# are never cancelled, so every commit that lands gets its full run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      native: ${{ steps.scope.outputs.native }}
      native_matrix: ${{ steps.scope.outputs.native_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide the scope of this run
        id: scope
        run: node .github/scripts/ci-scope.mjs
        env:
          EVENT: ${{ github.event_name }}

  lint:
    name: Lint and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync framework docs
        run: node scripts/sync-krate-docs.mjs

      - name: Go build
        run: go build ./...
        working-directory: packages/compiler

      - name: Build JS packages
        run: pnpm -r --filter '!@krate/web' --filter '!@krate/benchmark' build

      - name: Go vet
        run: go vet ./...
        working-directory: packages/compiler

      - name: Go vet (native)
        run: go vet ./...
        working-directory: packages/native

      # Build the linter with the project's Go toolchain (from go.mod) so its
      # analysis Go version matches the targeted version. A prebuilt binary is
      # built with an older Go and refuses to load the config.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m
        working-directory: packages/compiler

      - name: golangci-lint (native)
        run: '"$(go env GOPATH)/bin/golangci-lint" run --timeout=5m'
        working-directory: packages/native

      - name: Check embedded docs are in sync
        run: node scripts/sync-krate-docs.mjs --check

      - name: Check compatibility matrix
        run: pnpm run check:matrix

      - name: Check benchmarks page is in sync
        run: node scripts/sync-benchmarks.mjs --check

      - name: Check roadmap and v1 gates
        run: pnpm run check:roadmap

      - name: Check package versions
        run: pnpm run check:version

      - name: Check release readiness
        run: pnpm run check:release

      - name: gofmt
        run: |
          unformatted=$(gofmt -l packages/compiler packages/native)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: TypeScript type-check
        run: pnpm run typecheck

      - name: JS unit tests (Vitest)
        run: pnpm run test:js

  # The Go tests on Linux, with the race detector, split into shards by the
  # recorded test times (.github/scripts/go-test-shards.mjs). Every shard
  # picks the same recorded times, lists the tests, plans the same partition
  # and runs its part; go-test-summary checks the shards agreed and ran every
  # listed test exactly once.
  go-test:
    name: Go (ubuntu-latest, race, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # actions: read lists the caches to pick the recorded test times.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Shard count: see the header comment.
        shards: [3]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: false

      - name: Restore the Go caches
        uses: ./.github/actions/go-cache-restore
        with:
          key: race
          test-cache: "true"

      # TestNativeDebugGoHostRestart drives a real dlv session; under
      # KRATE_REQUIRE_E2E a missing dlv is a failure.
      - name: Install Delve
        run: |
          go install github.com/go-delve/delve/cmd/dlv@v1.27.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # The native host-child release tests compile with bun and deno, and
      # KRATE_REQUIRE_E2E turns a missing runtime into a failure.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: 2.9.8

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync framework docs
        run: node scripts/sync-krate-docs.mjs

      - name: Build JS packages
        run: pnpm -r --filter '!@krate/web' --filter '!@krate/benchmark' build

      # Every shard picks the same entry: the newest this run may restore
      # that was saved before the run started.
      - name: Pick the recorded test times
        id: times
        run: node .github/scripts/go-test-shards.mjs pick --kind Linux
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Restore the recorded test times
        if: steps.times.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: go-test-times/Linux
          key: ${{ steps.times.outputs.key }}
          fail-on-cache-miss: true
          # The summary job saves the times on Linux for every OS.
          enableCrossOsArchive: true

      # Listed from source, nothing compiled: each shard compiles only the
      # packages it runs. go-test-list checks the listing against go test.
      - name: List the Go tests
        run: node .github/scripts/go-test-shards.mjs list --module packages/compiler --module packages/native --out go-tests.json

      # checkptr is disabled: modernc.org/quickjs (translated C) trips the
      # checkptr instrumentation under -race. Data-race detection is unaffected.
      # Two packages at a time, each running up to 4 tests (the runner's
      # cores); more saturates the runner (eval timeouts).
      - name: Go test (race)
        run: node .github/scripts/go-test-shards.mjs run --list go-tests.json --times go-test-times/Linux/times.json --groups .github/scripts/go-test-groups.json --shards ${{ matrix.shards }} --shard ${{ matrix.shard }} --serial-weight 4 --times-key "${{ steps.times.outputs.key }}" --plan-out go-test-plan.json --jobs 2 --out go-test-results -- -race -gcflags=all=-d=checkptr=0 -parallel 4 -timeout 20m ${{ github.event_name != 'pull_request' && '-count=1' || '' }}
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-results-Linux-${{ matrix.shard }}
          path: |
            go-tests.json
            go-test-plan.json
            go-test-results/
          retention-days: 7

      # Already part of go test above; re-run for the pass-rate table.
      - name: Parser conformance summary
        if: matrix.shard == 0
        run: |
          status=0
          go test -count=1 -run TestConformance ./internal/conformance || status=$?
          if [ -f "$KRATE_CONFORMANCE_MARKDOWN" ]; then
            cat "$KRATE_CONFORMANCE_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
        working-directory: packages/compiler
        env:
          KRATE_CONFORMANCE_MARKDOWN: ${{ runner.temp }}/conformance.md
          KRATE_CONFORMANCE_SUMMARY: ${{ runner.temp }}/conformance.json

      # A 60-page site over one 2000-module graph with both kinds of island:
      # each shared module must compile once per build and doubling the pages
      # must not double the build. Timed without -race; the table goes to the
      # job summary.
      - name: Shared-graph build benchmark
        if: matrix.shard == 1
        run: go test -count=1 -run TestSharedGraphCompiledOncePerBuild -v ./internal/build
        working-directory: packages/compiler
        env:
          KRATE_REQUIRE_E2E: "1"

      # Every shard compiles every test binary (listing does), so one shard's
      # cache serves them all; one save avoids the shards racing for the key.
      - name: Save the Go caches
        if: always() && matrix.shard == 0
        uses: ./.github/actions/go-cache-save

  # Installs the packed packages with npm and runs the installed compiler. It
  # needs a version nothing on npm has, as at release time. macOS and Windows
  # matter here: the exec bit, the .exe path, .cmd shims and spaces in paths
  # only fail there.
  install-smoke:
    name: Install smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: core-linux-x64
          - os: macos-latest
            platform: core-darwin-arm64
          - os: windows-latest
            platform: core-win32-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # A version nothing on npm has, as at release time.
      - name: Sync package versions
        run: node scripts/set-version.mjs 0.0.0-smoke.0

      # set-version.mjs above rewrites the workspace versions, so the lockfile
      # no longer matches by design.
      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build JS packages
        run: pnpm -r --filter "!@krate/web" --filter "!@krate/benchmark" build

      - name: Build the platform package
        run: node scripts/build-platform-packages.mjs
        env:
          KRATE_ONLY_PLATFORM: ${{ matrix.platform }}

      - name: Test the release scripts
        run: node --test scripts/smoke-helpers.test.mjs scripts/release-scripts.test.mjs scripts/release-ci-gate.test.mjs

      - name: Install and run the packages
        run: node scripts/smoke-install.mjs

  # The musl binary is the one Alpine users get. The packages are built here and
  # installed inside node:alpine, where @krate/core picks core-linux-x64-musl.
  install-smoke-musl:
    name: Install smoke test (Alpine, musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Sync package versions
        run: node scripts/set-version.mjs 0.0.0-smoke.0

      # set-version.mjs above rewrites the workspace versions, so the lockfile
      # no longer matches by design.
      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build JS packages
        run: pnpm -r --filter "!@krate/web" --filter "!@krate/benchmark" build

      - name: Build the platform package
        run: node scripts/build-platform-packages.mjs
        env:
          KRATE_ONLY_PLATFORM: core-linux-x64-musl

      - name: Install and run the packages on Alpine
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo node:22-alpine sh -c \
            'npm install --global pnpm@11.9.0 >/dev/null && node scripts/smoke-install.mjs'

  # The Go tests on macOS and Windows, split into shards like go-test.
  go-matrix:
    name: Go (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Shard counts: see the header comment.
        include:
          - { os: macos-latest, kind: macOS, cores: 3, shards: 1, shard: 0 }
          - { os: windows-latest, kind: Windows, cores: 4, shards: 2, shard: 0 }
          - { os: windows-latest, kind: Windows, cores: 4, shards: 2, shard: 1 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: false

      - name: Restore the Go caches
        uses: ./.github/actions/go-cache-restore
        with:
          key: test
          test-cache: "true"

      # The integration tests load examples/krate.config.ts, which imports the
      # workspace @krate/core package, so the JS workspace must be linked.
      # TestNativeDebugGoHostRestart drives a real dlv session; under
      # KRATE_REQUIRE_E2E a missing dlv is a failure.
      - name: Install Delve
        run: |
          go install github.com/go-delve/delve/cmd/dlv@v1.27.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # The native host-child release tests compile with bun and deno, and
      # KRATE_REQUIRE_E2E turns a missing runtime into a failure.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: 2.9.8

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # The examples config imports the workspace @krate/core package, whose
      # entry point is the built dist/, so build the JS packages first.
      - name: Build JS packages
        run: pnpm -r --filter '!@krate/web' --filter '!@krate/benchmark' build

      # Every shard picks the same entry: the newest this run may restore
      # that was saved before the run started.
      - name: Pick the recorded test times
        id: times
        run: node .github/scripts/go-test-shards.mjs pick --kind ${{ matrix.kind }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Restore the recorded test times
        if: steps.times.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: go-test-times/${{ matrix.kind }}
          key: ${{ steps.times.outputs.key }}
          fail-on-cache-miss: true
          # The summary job saves the times on Linux for every OS.
          enableCrossOsArchive: true

      - name: List the Go tests
        run: node .github/scripts/go-test-shards.mjs list --module packages/compiler --module packages/native --out go-tests.json

      - name: Go test
        run: node .github/scripts/go-test-shards.mjs run --list go-tests.json --times go-test-times/${{ matrix.kind }}/times.json --groups .github/scripts/go-test-groups.json --shards ${{ matrix.shards }} --shard ${{ matrix.shard }} --serial-weight ${{ matrix.cores }} --times-key "${{ steps.times.outputs.key }}" --plan-out go-test-plan.json --jobs 2 --out go-test-results -- -parallel ${{ matrix.cores }} -timeout 30m ${{ github.event_name != 'pull_request' && '-count=1' || '' }}
        env:
          # The JS workspace and runtime dist are built above, so a missing E2E
          # prerequisite here indicates a real problem, not a bare environment.
          KRATE_REQUIRE_E2E: "1"

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-results-${{ matrix.kind }}-${{ matrix.shard }}
          path: |
            go-tests.json
            go-test-plan.json
            go-test-results/
          retention-days: 7

      - name: Save the Go caches
        if: always() && matrix.shard == 0
        uses: ./.github/actions/go-cache-save

  # The shards list the tests from source (go-test-list.go). This job builds
  # every test binary and checks go test -list names the same tests on each
  # OS, so a test the source listing misses fails CI instead of going unrun.
  # Nothing waits on it.
  go-test-list:
    name: Go test list matches (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: false

      - name: Restore the Go caches
        uses: ./.github/actions/go-cache-restore
        with:
          key: test

      - name: Compare the source listing with go test -list
        run: node .github/scripts/go-test-shards.mjs check-list --module packages/compiler --module packages/native

  # Checks the shards of each OS planned alike and together ran every listed
  # test exactly once (a shard only knows its own part), and on full runs
  # records the test times the next runs plan with. It runs after the shards,
  # not in front of them.
  go-test-summary:
    name: Go tests ran in full
    needs: [go-test, go-matrix]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the shard script
        run: node --test .github/scripts/go-test-shards.test.mjs

      - name: Download the test results
        uses: actions/download-artifact@v4
        with:
          pattern: go-test-results-*
          path: results

      - name: Check every listed test ran
        run: |
          status=0
          for kind in Linux macOS Windows; do
            echo "== $kind"
            set -- results/go-test-results-"$kind"-*
            if [ ! -d "$1" ]; then
              echo "no results from the $kind shards"
              status=1
              continue
            fi
            # Every shard lists the tests itself; they must agree.
            for d in "$@"; do
              if ! cmp -s "$1/go-tests.json" "$d/go-tests.json"; then
                echo "$d listed other tests than $1"
                status=1
              fi
            done
            # Every shard must have planned from the same times, alike.
            dirs=()
            plans=""
            for d in "$@"; do
              dirs+=(--results "$d/go-test-results")
              plans="$plans${plans:+,}$d/go-test-plan.json"
            done
            mkdir -p "go-test-times/$kind"
            node .github/scripts/go-test-shards.mjs merge --list "$1/go-tests.json" --plans "$plans" "${dirs[@]}" --times-out "go-test-times/$kind/times.json" || status=1
          done
          exit $status

      - name: Save the Linux times
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: go-test-times/Linux
          key: go-test-times-Linux-${{ github.sha }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

      - name: Save the macOS times
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: go-test-times/macOS
          key: go-test-times-macOS-${{ github.sha }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

      - name: Save the Windows times
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: go-test-times/Windows
          key: go-test-times-Windows-${{ github.sha }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  # Vet and build the native module for every other OS and architecture the
  # native jobs do not run on, from one Linux runner. The compiled packages
  # come from the Go cache (keyed on the sources), so an unchanged platform
  # layer costs almost nothing.
  native-cross:
    name: Native cross-compile
    needs: changes
    if: needs.changes.outputs.native != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: false

      - name: Restore the Go caches
        uses: ./.github/actions/go-cache-restore
        with:
          key: cross

      - name: Cross-compile the platform layers
        run: |
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/arm64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
          done
        working-directory: packages/native

      - name: Save the Go caches
        if: always()
        uses: ./.github/actions/go-cache-save

  # Krate Native: the real-window (GUI) tests, the compiler's native tests,
  # and on full runs the packaging and update smoke tests, on each OS.
  #
  # Which runners a pull request gets comes from the changes job (see
  # .github/scripts/ci-scope.mjs). Roles: "primary" (ubuntu-latest) runs the
  # whole GUI set plus the browser variant; "platform" (macos-latest,
  # windows-latest) runs the whole GUI set, since their platform layers only
  # run there; "thin" (the arm64 runners) runs the shell's GUI tests and the
  # main end-to-end test on pull requests, everything on full runs.
  #
  # The vet, unit and race tests of the native module run in the Go jobs
  # (and the GUI step below runs the module's unit tests again, with the GUI
  # ones), the cross-compile in native-cross.
  #
  # The GUI step runs the whole native module (./...) with KRATE_NATIVE_GUI=1,
  # so a GUI test added in any package is picked up without editing this file.
  # node, bun and deno are installed on every OS, Windows on ARM included, so
  # the host-child tests run; KRATE_REQUIRE_E2E=1 turns a missing tool into a
  # failure. Packaging tools the Windows on ARM image lacks are named in its
  # optional_tools; each is skipped with a ::notice:: line when really missing.
  native:
    name: Native (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.native != 'none'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.native_matrix) }}
    defaults:
      run:
        shell: bash
    env:
      # Plugin tests build per-app shells with the Go toolchain; a read-only
      # module cache would make their temporary modules fail to clean up.
      GOFLAGS: -modcacherw
      # Read by scripts/native-smoke.mjs.
      KRATE_OPTIONAL_TOOLS: ${{ matrix.optional_tools }}
      ROLE: ${{ matrix.role }}
      FULL: ${{ needs.changes.outputs.full }}
      NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      # The snaps the snap smoke test builds with, bases first. Changing the list
      # changes the cache key, so the next full run downloads them again.
      SNAPS: core22 core24 snapcraft gnome-46-2404 gnome-46-2404-sdk mesa-2404 gtk-common-themes
      # The GUI packages: the whole module, or on a thin pull-request run the
      # shell's GUI tests only.
      GUI_PKGS: ${{ (matrix.role == 'thin' && needs.changes.outputs.full != 'true') && './shell' || './...' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: false

      - name: Restore the Go caches
        uses: ./.github/actions/go-cache-restore
        with:
          key: native

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: 2.9.8

      # Every host runtime must be present: the host child tests need all three.
      - name: Check the host runtimes
        run: |
          status=0
          for t in node bun deno; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "$t: $("$t" --version | head -1)"
            else
              echo "::error title=$t missing::$t is not installed on this runner"
              status=1
            fi
          done
          exit $status

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync framework docs
        run: node scripts/sync-krate-docs.mjs

      - name: Build JS packages
        run: pnpm -r --filter '!@krate/web' --filter '!@krate/benchmark' build

      # The real services the Linux tests talk to: dunst (notifications),
      # openbox (window-manager state), xdotool (clicks), weston (a Wayland
      # compositor) and the tools the packaging smoke test needs (rpm,
      # desktop-file-validate, squashfs).
      - name: Install the Linux webview, Xvfb and desktop services
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb openbox xdotool dbus dbus-bin \
            dunst at-spi2-core gdb
          if [ "$FULL" = true ]; then
            sudo apt-get install -y weston rpm desktop-file-utils squashfs-tools file
          fi

      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux' && env.FULL == 'true'
        run: |
          mkdir -p "$HOME/bin"
          # appimagetool-x86_64 or appimagetool-aarch64, matching the runner.
          curl -fsSL -o "$HOME/bin/appimagetool.AppImage" "https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-$(uname -m).AppImage"
          chmod +x "$HOME/bin/appimagetool.AppImage"
          # No FUSE on the runner: run the tool by extracting it.
          printf '#!/bin/sh\nAPPIMAGE_EXTRACT_AND_RUN=1 exec "%s/bin/appimagetool.AppImage" "$@"\n' "$HOME" > "$HOME/bin/appimagetool"
          chmod +x "$HOME/bin/appimagetool"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # -p 1: GUI packages share one display and one webview at a time. Runs
      # under openbox, so fullscreen, maximize and minimize are real window
      # manager state, and with the real daemons installed above:
      # KRATE_REQUIRE_E2E makes a missing daemon a failure, not a skip.
      - name: GUI tests (Linux, Xvfb and openbox, real desktop services)
        if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2016
          xvfb-run -a bash -c '
            openbox --sm-disable &
            wm=$!
            sleep 1
            go test -p 1 -count=1 -timeout 20m -v $GUI_PKGS
            status=$?
            kill $wm
            exit $status
          '
        working-directory: packages/native
        env:
          KRATE_NATIVE_GUI: "1"
          KRATE_NATIVE_WM: "1"
          KRATE_REQUIRE_E2E: "1"

      # The same GUI packages under a Wayland compositor: weston nested on
      # Xvfb (its x11 backend has an input seat; the headless backend has none
      # and GTK's clipboard crashes without a seat). GDK_BACKEND=wayland makes
      # GTK use it. The tests are the X11 pass's; only the GDK backend differs,
      # so pull requests run the X11 pass alone.
      - name: "GUI tests (Linux, Wayland via weston on Xvfb)"
        if: runner.os == 'Linux' && env.FULL == 'true'
        run: |
          # shellcheck disable=SC2016
          xvfb-run -a bash -c '
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            chmod 700 "$XDG_RUNTIME_DIR"
            weston --backend=x11 --renderer=pixman --socket=wl-ci --width=1280 --height=800 --no-config &
            comp=$!
            for i in $(seq 1 50); do
              [ -S "$XDG_RUNTIME_DIR/wl-ci" ] && break
              sleep 0.2
            done
            [ -S "$XDG_RUNTIME_DIR/wl-ci" ] || { echo "weston did not start"; kill $comp; exit 1; }
            GDK_BACKEND=wayland WAYLAND_DISPLAY=wl-ci go test -p 1 -count=1 -timeout 20m ./platform/linux ./sdk/... ./shell
            status=$?
            kill $comp
            exit $status
          '
        working-directory: packages/native
        env:
          KRATE_NATIVE_GUI: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"

      # Blocking, like the Linux GUI steps: a failing macOS or Windows GUI test
      # fails the job. -v keeps skips visible in the log.
      - name: GUI tests (macOS, Windows)
        if: runner.os != 'Linux'
        run: |
          # shellcheck disable=SC2086
          go test -p 1 -count=1 -timeout 20m -v $GUI_PKGS
        working-directory: packages/native
        env:
          KRATE_NATIVE_GUI: "1"
          KRATE_REQUIRE_E2E: "1"

      # A flake check: the Linux request-body crash (a body stream read off the
      # main thread) showed up in about 1 of 100 runs, so the packages that
      # exercise it run three more times. Nightly and manual runs only. ./shell
      # is not repeated: its GUI tests walk one page load in order, so a second
      # pass in the same process cannot work.
      - name: GUI tests repeated (Linux, platform/linux, sdk/guitest)
        if: runner.os == 'Linux' && env.NIGHTLY == 'true'
        run: |
          # shellcheck disable=SC2016
          xvfb-run -a bash -c '
            openbox --sm-disable &
            wm=$!
            sleep 1
            go test -p 1 -count=3 -timeout 30m ./platform/linux ./sdk/guitest
            status=$?
            kill $wm
            exit $status
          '
        working-directory: packages/native
        env:
          KRATE_NATIVE_GUI: "1"
          KRATE_NATIVE_WM: "1"
          KRATE_REQUIRE_E2E: "1"

      # The compiler's native tests build the example apps and drive the
      # shell. Pull requests skip TestNativeBudgetGUI (cold start and memory
      # against packages/native/budgets.json); full runs check it, with 3x on
      # the cold-start limit for the hosted runner (KRATE_BUDGET_SCALE).
      #
      # A private session bus with dunst on the test display: the runner's own
      # session bus would start dunst through systemd without the display, and
      # a notification would wait for the bus's 25s activation timeout.
      - name: Compiler native tests (Linux, GUI under Xvfb)
        if: runner.os == 'Linux'
        run: |
          if [ "$FULL" = true ]; then run='GUI'; skip=''
          elif [ "$ROLE" = thin ]; then run='^TestNativeE2EGUI$'; skip=''
          else run='GUI'; skip='TestNativeBudgetGUI'; fi
          export run skip
          # shellcheck disable=SC2016
          xvfb-run -a dbus-run-session -- bash -c '
            dunst &
            notifier=$!
            sleep 1
            go test -p 1 -count=1 -timeout 20m -v -run "$run" -skip "$skip" ./internal/build
            status=$?
            kill $notifier
            exit $status
          '
        working-directory: packages/compiler
        env:
          KRATE_NATIVE_GUI: "1"
          KRATE_REQUIRE_E2E: "1"
          KRATE_BUDGET_SCALE: "3"

      # Acceptance: the docs site builds as a native app, packages as .deb,
      # .rpm, .tar.gz and an AppImage, and the installed binaries serve it.
      - name: Docs site as a native app (Linux)
        if: matrix.role == 'primary' && env.FULL == 'true'
        run: xvfb-run -a go test -count=1 -timeout 30m -v -run TestNativeDocsSiteE2E ./cmd/krate
        working-directory: packages/compiler
        env:
          KRATE_E2E_DOCS: "1"
          KRATE_NATIVE_GUI: "1"
          KRATE_REQUIRE_E2E: "1"

      # The same on macOS and Windows (including the host child test, which
      # runs Node, Bun and Deno through the real shell). Full runs add the
      # budgets, the universal app and the Mac App Store sandbox. A platform
      # with no budget entries only reports: look for the BUDGET-RECORD-BEGIN
      # block in this step's log (or in the job summary), a fragment of
      # budgets.json to paste in.
      - name: Compiler native tests (macOS, Windows)
        if: runner.os != 'Linux'
        run: |
          if [ "$FULL" = true ]; then run='GUI|TestNativeBudgetSizes'; skip=''
          elif [ "$ROLE" = thin ]; then run='^TestNativeE2EGUI$'; skip=''
          else run='GUI'; skip='TestNativeBudgetGUI|TestNativeMASSandboxGUI'; fi
          go test -p 1 -count=1 -timeout 20m -v -run "$run" -skip "$skip" ./internal/build
        working-directory: packages/compiler
        env:
          GOWORK: "off"
          KRATE_NATIVE_GUI: "1"
          KRATE_REQUIRE_E2E: "1"
          KRATE_BUDGET_SCALE: "3"
          KRATE_NATIVE_BUDGETS: "1"

      # Plugins are Go code linked into a per-app shell, built with the Go
      # toolchain on the runner; the system-info plugin has its own module.
      - name: Native plugin tests (macOS, Windows)
        if: runner.os != 'Linux' && env.FULL == 'true'
        run: |
          (cd packages/compiler && GOWORK=off go test -p 1 -count=1 -timeout 20m -run Plugin ./internal/build)
          (cd examples/native-plugin/native-plugins/system-info && GOWORK=off go test -count=1 ./...)

      # Binary sizes (the stripped shell, Go-only, TypeScript-only and example
      # release executables) against packages/native/budgets.json. No display.
      - name: Native size budgets (Linux)
        if: runner.os == 'Linux' && env.FULL == 'true'
        run: go test -p 1 -count=1 -timeout 20m -run 'TestNativeBudgetSizes' -v ./internal/build
        working-directory: packages/compiler
        env:
          KRATE_REQUIRE_E2E: "1"
          KRATE_NATIVE_BUDGETS: "1"

      # Packaging, install, launch and update smoke tests, per OS (see
      # scripts/native-smoke.mjs), on full runs. "prepare" builds the example
      # as 1.0.0 and 1.1.0 with `krate native build --release --package` and a
      # freshly generated updater key; the other steps install 1.0.0 the way a
      # user would, check that it serves its first page, and update it to
      # 1.1.0 through the real updater against a local signed feed.
      - name: Packaging smoke test, build packages (Linux)
        if: runner.os == 'Linux' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs linux prepare
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, .deb install, launch, remove (Linux)
        if: runner.os == 'Linux' && env.FULL == 'true'
        run: xvfb-run -a node scripts/native-smoke.mjs linux deb

      - name: Packaging smoke test, .rpm structure (Linux)
        if: runner.os == 'Linux' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs linux rpm
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, AppImage launch (Linux)
        if: runner.os == 'Linux' && env.FULL == 'true'
        run: xvfb-run -a node scripts/native-smoke.mjs linux appimage
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Update smoke test, 1.0.0 to 1.1.0 (Linux)
        if: runner.os == 'Linux' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs linux update

      # Real signatures with a key generated in the job: krate native sign
      # --gpg-key, then gpg --verify on every package (and a tampered copy must
      # fail). Notarization and Developer ID signing need secrets and stay
      # manual (docs/native/signing).
      - name: Signing smoke test, gpg (Linux)
        if: runner.os == 'Linux' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs linux sign
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, build packages (macOS)
        if: runner.os == 'macOS' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs macos prepare

      - name: Packaging smoke test, mount the dmg, launch (macOS)
        if: runner.os == 'macOS' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs macos dmg

      - name: Update smoke test, 1.0.0 to 1.1.0 (macOS)
        if: runner.os == 'macOS' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs macos update

      # codesign with the ad hoc signature of "prepare" and with a self-signed
      # identity from a temporary keychain, both checked with codesign --verify
      # --deep --strict (a tampered bundle must fail).
      - name: Signing smoke test, ad hoc and self-signed identity (macOS)
        if: runner.os == 'macOS' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs macos sign
        env:
          KRATE_REQUIRE_E2E: "1"

      # A universal (arm64 + amd64 lipo) app bundle and a Mac App Store
      # package (sandbox entitlements, ad hoc signed), both structure-checked.
      - name: Packaging smoke test, universal app (macOS)
        if: runner.os == 'macOS' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs macos universal
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, Mac App Store package (macOS)
        if: runner.os == 'macOS' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs macos mas
        env:
          KRATE_REQUIRE_E2E: "1"

      # NSIS is an x86 program; on Windows on ARM it runs emulated, and the
      # runner image may lack Chocolatey. makensis is optional there
      # (optional_tools): the smoke steps then skip the NSIS installer with a
      # notice.
      - name: Install NSIS and create a signing certificate (Windows)
        if: runner.os == 'Windows' && env.FULL == 'true'
        continue-on-error: ${{ contains(matrix.optional_tools, 'makensis') }}
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Create a signing certificate (Windows)
        if: runner.os == 'Windows' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs windows cert
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, build and sign packages (Windows)
        if: runner.os == 'Windows' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs windows prepare
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, NSIS silent install, launch, uninstall (Windows)
        if: runner.os == 'Windows' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs windows nsis
        env:
          KRATE_REQUIRE_E2E: "1"

      # The installer's WebView2 check against the real registry, with a
      # stand-in bootstrapper (nothing is downloaded, the runner's runtime
      # registration is hidden only for the run and restored).
      - name: Packaging smoke test, NSIS WebView2 check (Windows)
        if: runner.os == 'Windows' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs windows webview2
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, MSIX validate, install, launch (Windows)
        if: runner.os == 'Windows' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs windows msix
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Update smoke test, 1.0.0 to 1.1.0 (Windows)
        if: runner.os == 'Windows' && env.FULL == 'true'
        run: node scripts/native-smoke.mjs windows update

      # Memory of the system webview on real macOS and Windows machines, on
      # full runs. `krate native profile --memory` builds the app, measures
      # PSS-equivalent and private memory per process role against a
      # blank-page floor and writes dist-native/report.json. The profile comes
      # from native.memory in krate.config.ts, set here per run and restored
      # afterwards.
      - name: Native memory report (macOS, Windows)
        if: runner.os != 'Linux' && env.FULL == 'true'
        env:
          GOWORK: "off"
        run: |
          set -x
          EXE=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=".exe"; fi
          (cd packages/compiler && go build -o "$RUNNER_TEMP/krate$EXE" ./cmd/krate)
          app=examples/native-tasks
          cfg="$app/krate.config.ts"
          mkdir -p native-memory
          status=0
          for profile in balanced performance; do
            cp "$cfg" "$RUNNER_TEMP/krate.config.ts.orig"
            sed "s/native: {/native: { memory: '$profile',/" "$RUNNER_TEMP/krate.config.ts.orig" > "$cfg"
            "$RUNNER_TEMP/krate$EXE" native profile --memory --idle 10s "$app" || status=1
            mkdir -p "native-memory/$profile"
            cp "$app/dist-native/report.json" "native-memory/$profile/report.json" || status=1
            cp "$RUNNER_TEMP/krate.config.ts.orig" "$cfg"
          done
          exit $status

      # Compare the numbers above with the linux-amd64 limits in
      # packages/native/budgets.json. Informational.
      - name: Native memory budget comparison (macOS, Windows)
        if: always() && runner.os != 'Linux' && env.FULL == 'true'
        continue-on-error: true
        run: |
          node scripts/native-budget-compare.mjs \
            "balanced=native-memory/balanced/report.json" \
            "performance=native-memory/performance/report.json"

      - name: Upload native memory reports
        if: always() && runner.os != 'Linux' && env.FULL == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-memory-${{ matrix.os }}
          path: native-memory
          if-no-files-found: warn

      - name: Cache Playwright browsers
        if: matrix.role == 'primary'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install chromium
        if: matrix.role == 'primary'
        run: pnpm exec playwright install --with-deps chromium

      # The native app with --browser in place of a webview, the dev session
      # and the release build.
      - name: Native end-to-end in the browser (chromium)
        if: matrix.role == 'primary'
        run: go test -p 1 -count=1 -timeout 20m -run 'TestNativeE2E|TestNativeDevSession|TestNativeRelease' -v ./internal/build
        working-directory: packages/compiler
        env:
          KRATE_BROWSER: chromium
          KRATE_REQUIRE_E2E: "1"

      # The slow packaging steps run last, on full runs. Flatpak builds against
      # the GNOME runtime from Flathub (the smoke script installs it per user);
      # the snap is built in destructive mode on the runner and installed with
      # --dangerous.
      - name: Install flatpak and flatpak-builder
        if: matrix.role == 'primary' && env.FULL == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Packaging smoke test, Flatpak build, install, run (Linux)
        if: matrix.role == 'primary' && env.FULL == 'true'
        run: xvfb-run -a node scripts/native-smoke.mjs linux flatpak
        env:
          KRATE_REQUIRE_E2E: "1"

      # snapcraft, its bases and the GNOME content snaps only come from the snap
      # store, which is sometimes unreachable from the runners. They are kept
      # as .snap files in the Actions cache, so a run needs the store only when
      # the key below changes. A failed download or install fails the run; it
      # is never retried or skipped.
      - name: Cache the snaps
        id: snaps
        if: matrix.role == 'primary' && env.FULL == 'true'
        uses: actions/cache@v4
        with:
          path: ~/snaps
          key: snaps-v1-${{ runner.arch }}-${{ env.SNAPS }}

      - name: Download the snaps
        if: matrix.role == 'primary' && env.FULL == 'true' && steps.snaps.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/snaps
          cd ~/snaps
          for s in $SNAPS; do
            snap download "$s" --basename="$s"
          done

      - name: Install snapcraft
        if: matrix.role == 'primary' && env.FULL == 'true'
        run: |
          cd ~/snaps
          for s in $SNAPS; do
            sudo snap ack "$s.assert"
          done
          for s in $SNAPS; do
            if [ "$s" = snapcraft ]; then
              sudo snap install ./snapcraft.snap --classic
            else
              sudo snap install "./$s.snap"
            fi
          done
          snapcraft --version

      - name: Packaging smoke test, snap build, install, run (Linux)
        if: matrix.role == 'primary' && env.FULL == 'true'
        run: xvfb-run -a node scripts/native-smoke.mjs linux snap
        env:
          KRATE_REQUIRE_E2E: "1"
          KRATE_SNAP_DESTRUCTIVE: "1"

      - name: Save the Go caches
        if: always()
        uses: ./.github/actions/go-cache-save

  node-versions:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24", "26"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Runtime sidecars and generateStaticParams
        run: go test ./internal/build -run 'TestActionSidecarTransport|TestExecuteGenerateStaticParamsRuntime' -count=1 -v
        working-directory: packages/compiler

  bun-deno:
    name: Bun and Deno runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: 2.9.8

      - name: Bun action sidecar and Deno static params
        run: go test ./internal/build -run 'TestActionSidecarTransport/bun|TestExecuteGenerateStaticParamsRuntime' -count=1 -v
        working-directory: packages/compiler

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Run benchmarks (informational)
        run: go test -run=^$ -bench=. -benchtime=200ms ./internal/lexer ./internal/parser ./internal/bundler ./internal/css ./internal/markdown ./internal/build
        working-directory: packages/compiler

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Fuzz lexer
        run: go test -fuzz=FuzzLexer -fuzztime=30s -run=^$ ./internal/lexer
        working-directory: packages/compiler

      - name: Fuzz parser
        run: go test -fuzz=FuzzParse -fuzztime=30s -run=^$ ./internal/parser
        working-directory: packages/compiler

      - name: Fuzz HTML minifier
        run: go test -fuzz=FuzzMinifyHTML -fuzztime=30s -run=^$ ./internal/build
        working-directory: packages/compiler

  browser-conformance:
    name: Browser conformance (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build JS packages
        run: pnpm -r --filter '!@krate/web' --filter '!@krate/benchmark' build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Browser conformance
        run: go test -run "TestBrowserConformance|TestTrimmedRuntimeBrowser" -count=1 -v ./internal/build
        working-directory: packages/compiler
        env:
          KRATE_BROWSER: ${{ matrix.browser }}
          KRATE_REQUIRE_E2E: "1"
          KRATE_HYDRATION_BUDGET_MS: "2500"

      # React 19 vs Krate differential over the R2/R3 corpus. Fails on any
      # divergence not listed in testdata/reactbrowser/divergences.json.
      - name: React browser differential
        run: go test -run 'TestReactBrowser' -count=1 -v ./internal/build
        working-directory: packages/compiler
        env:
          KRATE_BROWSER: ${{ matrix.browser }}
          KRATE_REQUIRE_E2E: "1"
          KRATE_REACT_EXIT: "1"
          KRATE_REACTBROWSER_REPORT: ${{ runner.temp }}/react-browser-${{ matrix.browser }}.txt

      # App-level browser tests: the SPA router (layouts, templates, parallel
      # and intercepting routes), client components inside server components,
      # the component library's accessibility, a server action redirect, and
      # CSP with speculation rules, and @krate/konva canvases (page and island).
      - name: App browser tests
        run: go test -run 'TestRouterBrowserE2E|TestUseClientIslandBrowser|TestComponentsA11yBrowser|TestServerActionRedirectInBrowser|TestCSPSpeculationRulesInBrowser|TestBrowserKonva' -count=1 -v ./internal/build
        working-directory: packages/compiler
        env:
          KRATE_BROWSER: ${{ matrix.browser }}
          KRATE_REQUIRE_E2E: "1"

      - name: Upload React differential report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-browser-diff-${{ matrix.browser }}
          path: ${{ runner.temp }}/react-browser-${{ matrix.browser }}.txt
          if-no-files-found: ignore

  preact-conformance:
    name: Preact ${{ matrix.preact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preact: ["10.20.0", "10.24.0", "10.29.8"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build JS packages
        run: pnpm -r --filter '!@krate/web' --filter '!@krate/benchmark' build

      - name: Pin Preact
        run: pnpm --filter krate-examples add -D preact@${{ matrix.preact }}

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser conformance
        run: go test -run "TestBrowserConformance|TestTrimmedRuntimeBrowser|TestBrowserKeptProviderSlotChangesShape" -count=1 -v ./internal/build
        working-directory: packages/compiler
        env:
          KRATE_BROWSER: chromium
          KRATE_REQUIRE_E2E: "1"
          KRATE_HYDRATION_BUDGET_MS: "2500"
