name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync framework docs
        run: node scripts/sync-krate-docs.mjs

      - name: Go build
        run: go build ./...
        working-directory: packages/compiler

      - name: Build JS packages
        run: pnpm -r --filter '!@krate/web' --filter '!@krate/benchmark' build

      - name: Go vet
        run: go vet ./...
        working-directory: packages/compiler

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: packages/compiler
          args: --timeout=5m

      - name: Check embedded docs are in sync
        run: node scripts/sync-krate-docs.mjs --check

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/compiler

      - name: TypeScript type-check
        run: pnpm run typecheck

      - name: JS unit tests (Vitest)
        run: pnpm run test:js

      - name: Go test (race)
        run: go test -race ./...
        working-directory: packages/compiler
        env:
          KRATE_REQUIRE_E2E: "1"

  go-matrix:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Go build
        run: go build ./...
        working-directory: packages/compiler

      - name: Go test
        run: go test ./...
        working-directory: packages/compiler

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Fuzz lexer
        run: go test -fuzz=FuzzLexer -fuzztime=30s -run=^$ ./internal/lexer
        working-directory: packages/compiler

      - name: Fuzz parser
        run: go test -fuzz=FuzzParse -fuzztime=30s -run=^$ ./internal/parser
        working-directory: packages/compiler
