name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      # TestNativeDebugGoHostRestart drives a real dlv session; under
      # KRATE_REQUIRE_E2E a missing dlv is a failure.
      - name: Install Delve
        if: ${{ !(runner.os == 'Windows' && runner.arch == 'ARM64') }}
        shell: bash
        run: |
          go install github.com/go-delve/delve/cmd/dlv@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # The native host-child release tests compile with bun and deno, and
      # KRATE_REQUIRE_E2E turns a missing runtime into a failure.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync framework docs
        run: node scripts/sync-krate-docs.mjs

      - name: Go build
        run: go build ./...
        working-directory: packages/compiler

      - name: Build JS packages
        run: pnpm -r --filter '!@krate/web' --filter '!@krate/benchmark' build

      - name: Go vet
        run: go vet ./...
        working-directory: packages/compiler

      - name: Go vet (native)
        run: go vet ./...
        working-directory: packages/native

      # Build the linter with the project's Go toolchain (from go.mod) so its
      # analysis Go version matches the targeted version. A prebuilt binary is
      # built with an older Go and refuses to load the config.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m
        working-directory: packages/compiler

      - name: golangci-lint (native)
        run: '"$(go env GOPATH)/bin/golangci-lint" run --timeout=5m'
        working-directory: packages/native

      - name: Check embedded docs are in sync
        run: node scripts/sync-krate-docs.mjs --check

      - name: Check compatibility matrix
        run: pnpm run check:matrix

      - name: Check roadmap and v1 gates
        run: pnpm run check:roadmap

      - name: Check package versions
        run: pnpm run check:version

      - name: Check release readiness
        run: pnpm run check:release

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/compiler

      - name: gofmt (native)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/native

      - name: TypeScript type-check
        run: pnpm run typecheck

      - name: JS unit tests (Vitest)
        run: pnpm run test:js

      # checkptr is disabled: modernc.org/quickjs (translated C) trips the
      # checkptr instrumentation under -race. Data-race detection is unaffected.
      # -p 2 keeps packages from saturating the runner (eval timeouts), and the
      # raised timeout accommodates the instrumented example builds.
      - name: Go test (race)
        run: go test -race -gcflags=all=-d=checkptr=0 -p 2 -timeout 20m -covermode=atomic -coverprofile=coverage.out ./...
        working-directory: packages/compiler
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
        working-directory: packages/compiler

      # The native module holds the embedded QuickJS engine and the host
      # runtime; same race flags as the compiler.
      - name: Go test (race, native)
        run: go test -race -gcflags=all=-d=checkptr=0 -p 2 -timeout 20m -covermode=atomic ./...
        working-directory: packages/native
        env:
          KRATE_REQUIRE_E2E: "1"

      # Already part of go test above; re-run for the pass-rate table.
      - name: Parser conformance summary
        run: |
          status=0
          go test -count=1 -run TestConformance ./internal/conformance || status=$?
          if [ -f "$KRATE_CONFORMANCE_MARKDOWN" ]; then
            cat "$KRATE_CONFORMANCE_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
        working-directory: packages/compiler
        env:
          KRATE_CONFORMANCE_MARKDOWN: ${{ runner.temp }}/conformance.md
          KRATE_CONFORMANCE_SUMMARY: ${{ runner.temp }}/conformance.json

  # Installs the packed packages with npm and runs the installed compiler. It
  # needs a version nothing on npm has, as at release time. macOS and Windows
  # matter here: the exec bit, the .exe path, .cmd shims and spaces in paths
  # only fail there.
  install-smoke:
    name: Install smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: core-linux-x64
          - os: macos-latest
            platform: core-darwin-arm64
          - os: windows-latest
            platform: core-win32-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # A version nothing on npm has, as at release time.
      - name: Sync package versions
        run: node scripts/set-version.mjs 0.0.0-smoke.0

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build JS packages
        run: pnpm -r --filter "!@krate/web" --filter "!@krate/benchmark" build

      - name: Build the platform package
        run: node scripts/build-platform-packages.mjs
        env:
          KRATE_ONLY_PLATFORM: ${{ matrix.platform }}

      - name: Test the release scripts
        run: node --test scripts/smoke-helpers.test.mjs scripts/release-scripts.test.mjs

      - name: Install and run the packages
        run: node scripts/smoke-install.mjs

  # The musl binary is the one Alpine users get. The packages are built here and
  # installed inside node:alpine, where @krate/core picks core-linux-x64-musl.
  install-smoke-musl:
    name: Install smoke test (Alpine, musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Sync package versions
        run: node scripts/set-version.mjs 0.0.0-smoke.0

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build JS packages
        run: pnpm -r --filter "!@krate/web" --filter "!@krate/benchmark" build

      - name: Build the platform package
        run: node scripts/build-platform-packages.mjs
        env:
          KRATE_ONLY_PLATFORM: core-linux-x64-musl

      - name: Install and run the packages on Alpine
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo node:22-alpine sh -c \
            'npm install --global pnpm@11.9.0 >/dev/null && node scripts/smoke-install.mjs'

  go-matrix:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      # The integration tests load examples/krate.config.ts, which imports the
      # workspace @krate/core package, so the JS workspace must be linked.
      # TestNativeDebugGoHostRestart drives a real dlv session; under
      # KRATE_REQUIRE_E2E a missing dlv is a failure.
      - name: Install Delve
        if: ${{ !(runner.os == 'Windows' && runner.arch == 'ARM64') }}
        shell: bash
        run: |
          go install github.com/go-delve/delve/cmd/dlv@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # The native host-child release tests compile with bun and deno, and
      # KRATE_REQUIRE_E2E turns a missing runtime into a failure.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      # The examples config imports the workspace @krate/core package, whose
      # entry point is the built dist/, so build the JS packages first.
      - name: Build JS packages
        run: pnpm -r --filter '!@krate/web' --filter '!@krate/benchmark' build

      - name: Go build
        run: go build ./...
        working-directory: packages/compiler

      - name: Go test
        run: go test ./...
        working-directory: packages/compiler
        env:
          # The JS workspace and runtime dist are built above, so a missing E2E
          # prerequisite here indicates a real problem, not a bare environment.
          KRATE_REQUIRE_E2E: "1"

      - name: Go test (native)
        run: go test ./...
        working-directory: packages/native
        env:
          KRATE_REQUIRE_E2E: "1"

  # Krate Native: vet, tests, the real-window (GUI) tests, packaging and update
  # smoke tests on each OS.
  #
  # The GUI step runs the whole native module (./...) with KRATE_NATIVE_GUI=1,
  # so a GUI test added in any package is picked up without editing this file.
  # node, bun and deno are installed on every OS (except Bun and Deno on
  # Windows on ARM, see below) so the host-child tests run;
  # KRATE_REQUIRE_E2E=1 turns a missing tool into a failure.
  #
  # arm64: ubuntu-24.04-arm and windows-11-arm run the same job natively
  # (macos-latest is arm64 already). Tools that have no arm64 build there are
  # named in the matrix entry's optional_runtimes / optional_tools; each is
  # skipped with a ::notice:: line when it is really missing, and a tool that
  # is not named stays a hard failure. KRATE_REQUIRE_E2E therefore never fails
  # for a missing optional tool and still fails for every other one.
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gui: ./...
          - os: ubuntu-24.04-arm
            gui: ./...
          - os: macos-latest
            gui: ./...
          - os: windows-latest
            gui: ./...
          - os: windows-11-arm
            gui: ./...
            # Bun and Deno publish no Windows on ARM builds; the runner
            # image may also lack the Windows SDK tools and NSIS.
            optional_runtimes: "bun,deno"
            optional_tools: "makensis,signtool,makeappx"
    defaults:
      run:
        shell: bash
    env:
      # Plugin tests build per-app shells with the Go toolchain; a read-only
      # module cache would make their temporary modules fail to clean up.
      GOFLAGS: -modcacherw
      # Read by scripts/native-smoke.mjs.
      KRATE_OPTIONAL_TOOLS: ${{ matrix.optional_tools }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      # TestNativeDebugGoHost* drive a real dlv session; without dlv they
      # skip, or fail under KRATE_REQUIRE_E2E. Delve does not support Windows
      # on ARM, where the tests skip (build.ErrDelveUnsupported).
      - name: Install Delve
        if: ${{ !(runner.os == 'Windows' && runner.arch == 'ARM64') }}
        run: |
          go install github.com/go-delve/delve/cmd/dlv@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/dlv" version

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        continue-on-error: ${{ contains(matrix.optional_runtimes, 'bun') }}
        with:
          bun-version: latest

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        continue-on-error: ${{ contains(matrix.optional_runtimes, 'deno') }}
        with:
          deno-version: v2.x

      # A host runtime that is missing and listed in optional_runtimes is
      # skipped by the host child tests (KRATE_SKIP_RUNTIMES); a missing one
      # that is not listed fails them under KRATE_REQUIRE_E2E.
      - name: Check the host runtimes
        env:
          OPTIONAL_RUNTIMES: ${{ matrix.optional_runtimes }}
        run: |
          skip=""
          for t in node bun deno; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "$t: $("$t" --version | head -1)"
            elif [[ ",$OPTIONAL_RUNTIMES," == *",$t,"* ]]; then
              echo "::notice title=$t unavailable::$t has no build for this runner ($RUNNER_OS $RUNNER_ARCH); its host child tests are skipped"
              skip="$skip,$t"
            else
              echo "::error title=$t missing::$t is not installed on this runner"
            fi
          done
          echo "KRATE_SKIP_RUNTIMES=${skip#,}" >> "$GITHUB_ENV"

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync framework docs
        run: node scripts/sync-krate-docs.mjs

      - name: Build JS packages
        run: pnpm -r --filter '!@krate/web' --filter '!@krate/benchmark' build

      - name: Go vet (native)
        run: go vet ./...
        working-directory: packages/native

      - name: Cross-compile the platform layers
        if: matrix.os == 'ubuntu-latest'
        run: |
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/arm64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
          done
        working-directory: packages/native

      - name: Go test (race, native)
        if: runner.os == 'Linux'
        run: go test -race -gcflags=all=-d=checkptr=0 -p 2 -timeout 20m ./...
        working-directory: packages/native
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Go test (native)
        if: runner.os != 'Linux'
        run: go test -timeout 20m ./...
        working-directory: packages/native
        env:
          KRATE_REQUIRE_E2E: "1"

      # The real services the Linux tests talk to: dunst (notifications),
      # stalonetray (XEmbed tray), the Ayatana application indicator service
      # (a StatusNotifierWatcher and host), openbox (window-manager state),
      # xdotool (clicks), weston (a Wayland compositor) and the tools the
      # packaging smoke test needs (rpm, desktop-file-validate, squashfs).
      - name: Install the Linux webview, Xvfb and desktop services
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb openbox xdotool dbus dbus-bin \
            dunst stalonetray ayatana-indicator-application weston \
            rpm desktop-file-utils squashfs-tools file at-spi2-core

      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/bin"
          # appimagetool-x86_64 or appimagetool-aarch64, matching the runner.
          curl -fsSL -o "$HOME/bin/appimagetool.AppImage" "https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-$(uname -m).AppImage"
          chmod +x "$HOME/bin/appimagetool.AppImage"
          # No FUSE on the runner: run the tool by extracting it.
          printf '#!/bin/sh\nAPPIMAGE_EXTRACT_AND_RUN=1 exec "%s/bin/appimagetool.AppImage" "$@"\n' "$HOME" > "$HOME/bin/appimagetool"
          chmod +x "$HOME/bin/appimagetool"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # -p 1: GUI packages share one display and one webview at a time. Runs
      # under openbox, so fullscreen, maximize and minimize are real window
      # manager state, and with the real daemons installed above:
      # KRATE_REQUIRE_E2E makes a missing daemon a failure, not a skip.
      - name: GUI tests (Linux, Xvfb and openbox, real desktop services)
        if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2016
          xvfb-run -a bash -c '
            openbox --sm-disable &
            wm=$!
            sleep 1
            go test -p 1 -count=1 -timeout 20m -v $GUI_PKGS
            status=$?
            kill $wm
            exit $status
          '
        working-directory: packages/native
        env:
          GUI_PKGS: ${{ matrix.gui }}
          KRATE_NATIVE_GUI: "1"
          KRATE_NATIVE_WM: "1"
          KRATE_REQUIRE_E2E: "1"
          # The real print dialog opens in this pass only.
          KRATE_NATIVE_PRINT_DIALOG: "1"

      # The same GUI packages under a Wayland compositor: weston nested on
      # Xvfb (its x11 backend has an input seat; the headless backend has none
      # and GTK's clipboard crashes without a seat). GDK_BACKEND=wayland makes
      # GTK use it. The XEmbed tray and key-grab tests skip themselves there;
      # TestWaylandPlacementIsIgnored checks that SetPosition and
      # SetAlwaysOnTop are accepted and ignored.
      - name: "GUI tests (Linux, Wayland via weston on Xvfb)"
        if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2016
          xvfb-run -a bash -c '
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            chmod 700 "$XDG_RUNTIME_DIR"
            weston --backend=x11 --renderer=pixman --socket=wl-ci --width=1280 --height=800 --no-config &
            comp=$!
            for i in $(seq 1 50); do
              [ -S "$XDG_RUNTIME_DIR/wl-ci" ] && break
              sleep 0.2
            done
            [ -S "$XDG_RUNTIME_DIR/wl-ci" ] || { echo "weston did not start"; kill $comp; exit 1; }
            GDK_BACKEND=wayland WAYLAND_DISPLAY=wl-ci go test -p 1 -count=1 -timeout 20m ./platform/linux ./sdk/... ./shell
            status=$?
            kill $comp
            exit $status
          '
        working-directory: packages/native
        env:
          KRATE_NATIVE_GUI: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"

      # Blocking, like the Linux GUI steps: a failing macOS or Windows GUI test
      # fails the job. -v keeps skips visible in the log.
      - name: GUI tests (macOS, Windows)
        if: runner.os != 'Linux'
        run: |
          # shellcheck disable=SC2086
          go test -p 1 -count=1 -timeout 20m -v $GUI_PKGS
        working-directory: packages/native
        env:
          GUI_PKGS: ${{ matrix.gui }}
          KRATE_NATIVE_GUI: "1"
          KRATE_REQUIRE_E2E: "1"

      # The Linux request-body crash (a body stream read off the main thread)
      # showed up in about 1 of 100 runs, so the packages that exercise it run
      # three times. ./shell is not repeated: its GUI tests walk one page load
      # in order (the first test consumes the page's first report), so a second
      # pass in the same process cannot work. It runs once in the step above;
      # TestGUIZMemoryPanel there reads packages/runtime/dist/krate-dev.js,
      # which the JS build produces.
      - name: GUI tests repeated (Linux, platform/linux, sdk/guitest)
        if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2016
          xvfb-run -a bash -c '
            openbox --sm-disable &
            wm=$!
            sleep 1
            go test -p 1 -count=3 -timeout 30m ./platform/linux ./sdk/guitest
            status=$?
            kill $wm
            exit $status
          '
        working-directory: packages/native
        env:
          KRATE_NATIVE_GUI: "1"
          KRATE_NATIVE_WM: "1"
          KRATE_REQUIRE_E2E: "1"

      # The compiler's native tests build the example app and drive the shell.
      # TestNativeBudgetGUI checks cold start and memory against
      # packages/native/budgets.json. The cold-start limit was measured on a
      # developer machine, so the hosted runner gets 3x on it
      # (KRATE_BUDGET_SCALE). Memory is PSS and private dirty per process role;
      # only app minus a blank-page floor (same shell, same runner) fails the
      # job, the absolute values print a warning. Memory limits are not scaled.
      #
      # A private session bus with dunst on the test display: the runner's own
      # session bus would start dunst through systemd without the display, and
      # a notification would wait for the bus's 25s activation timeout.
      - name: Compiler native tests (Linux, GUI under Xvfb)
        if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2016
          xvfb-run -a dbus-run-session -- bash -c '
            dunst &
            notifier=$!
            sleep 1
            go test -p 1 -count=1 -timeout 20m -v -run "TestNativeE2EGUI|TestNativeBudgetGUI|TestNativeDebugGoHost|GUI" ./internal/build
            status=$?
            kill $notifier
            exit $status
          '
        working-directory: packages/compiler
        env:
          KRATE_NATIVE_GUI: "1"
          KRATE_REQUIRE_E2E: "1"
          KRATE_BUDGET_SCALE: "3"

      # Acceptance: the docs site builds as a native app, packages as .deb,
      # .rpm, .tar.gz and an AppImage, and the installed binaries serve it.
      # Needs the JS packages built (above), appimagetool, file and rpm.
      - name: Docs site as a native app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a go test -count=1 -timeout 30m -v -run TestNativeDocsSiteE2E ./cmd/krate
        working-directory: packages/compiler
        env:
          KRATE_E2E_DOCS: "1"
          KRATE_NATIVE_GUI: "1"
          KRATE_REQUIRE_E2E: "1"

      # Plugins are Go code linked into a per-app shell, built with the Go
      # toolchain on the runner; the system-info plugin has its own module.
      - name: Native plugin tests (macOS, Windows)
        if: runner.os != 'Linux'
        run: |
          (cd packages/compiler && GOWORK=off go test -p 1 -count=1 -timeout 20m -run Plugin ./internal/build)
          (cd examples/native-plugin/native-plugins/system-info && GOWORK=off go test -count=1 ./...)

      # The views example (a sidebar and a log view split off the main page)
      # must keep compiling; TestGUIViews in the module-wide GUI step covers
      # the runtime side on every OS.
      - name: Build examples/native-views
        env:
          GOWORK: "off"
        run: |
          EXE=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=".exe"; fi
          (cd packages/compiler && go build -o "$RUNNER_TEMP/krate-views$EXE" ./cmd/krate)
          (cd examples/native-views && "$RUNNER_TEMP/krate-views$EXE" build)

      # The same on macOS and Windows (including the host child test, which
      # runs Node, Bun and Deno through the real shell, and the size budgets).
      # The budget tests enforce the entries budgets.json has for the platform
      # (darwin-arm64, windows-amd64, ...). A platform with none yet only
      # reports: look for the BUDGET-RECORD-BEGIN block in this step's log (or
      # in the job summary), a fragment of budgets.json to paste in.
      - name: Compiler native tests (macOS, Windows)
        if: runner.os != 'Linux'
        run: go test -p 1 -count=1 -timeout 20m -v -run 'TestNativeE2EGUI|TestNativeBudgetGUI|TestNativeBudgetSizes|TestNativeDebugGoHost|TestNativeUniversalMacApp|TestNativeMASSandboxGUI|GUI' ./internal/build
        working-directory: packages/compiler
        env:
          GOWORK: "off"
          KRATE_NATIVE_GUI: "1"
          KRATE_REQUIRE_E2E: "1"
          KRATE_BUDGET_SCALE: "3"

      # Binary sizes (the stripped shell, Go-only, TypeScript-only and example
      # release executables) against packages/native/budgets.json. No display.
      # linux-arm64 has no entries yet and only reports (BUDGET-RECORD block).
      - name: Native size budgets (Linux)
        if: runner.os == 'Linux'
        run: go test -p 1 -count=1 -timeout 20m -run 'TestNativeBudgetSizes' -v ./internal/build
        working-directory: packages/compiler
        env:
          KRATE_REQUIRE_E2E: "1"

      # Packaging, install, launch and update smoke tests, per OS (see
      # scripts/native-smoke.mjs). "prepare" builds the example as 1.0.0 and
      # 1.1.0 with `krate native build --release --package` and a freshly
      # generated updater key; the other steps install 1.0.0 the way a user
      # would, check that it serves its first page, and update it to 1.1.0
      # through the real updater against a local signed feed.
      - name: Packaging smoke test, build packages (Linux)
        if: runner.os == 'Linux'
        run: node scripts/native-smoke.mjs linux prepare
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, .deb install, launch, remove (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/native-smoke.mjs linux deb

      - name: Packaging smoke test, .rpm structure (Linux)
        if: runner.os == 'Linux'
        run: node scripts/native-smoke.mjs linux rpm
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, AppImage launch (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/native-smoke.mjs linux appimage
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Update smoke test, 1.0.0 to 1.1.0 (Linux)
        if: runner.os == 'Linux'
        run: node scripts/native-smoke.mjs linux update

      # Real signatures with a key generated in the job: krate native sign
      # --gpg-key, then gpg --verify on every package (and a tampered copy must
      # fail). Notarization and Developer ID signing need secrets and stay
      # manual (docs/native/signing).
      - name: Signing smoke test, gpg (Linux)
        if: runner.os == 'Linux'
        run: node scripts/native-smoke.mjs linux sign
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, build packages (macOS)
        if: runner.os == 'macOS'
        run: node scripts/native-smoke.mjs macos prepare

      - name: Packaging smoke test, mount the dmg, launch (macOS)
        if: runner.os == 'macOS'
        run: node scripts/native-smoke.mjs macos dmg

      - name: Update smoke test, 1.0.0 to 1.1.0 (macOS)
        if: runner.os == 'macOS'
        run: node scripts/native-smoke.mjs macos update

      # codesign with the ad hoc signature of "prepare" and with a self-signed
      # identity from a temporary keychain, both checked with codesign --verify
      # --deep --strict (a tampered bundle must fail).
      - name: Signing smoke test, ad hoc and self-signed identity (macOS)
        if: runner.os == 'macOS'
        run: node scripts/native-smoke.mjs macos sign
        env:
          KRATE_REQUIRE_E2E: "1"

      # A universal (arm64 + amd64 lipo) app bundle and a Mac App Store
      # package (sandbox entitlements, ad hoc signed), both structure-checked.
      - name: Packaging smoke test, universal app (macOS)
        if: runner.os == 'macOS'
        run: node scripts/native-smoke.mjs macos universal
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, Mac App Store package (macOS)
        if: runner.os == 'macOS'
        run: node scripts/native-smoke.mjs macos mas
        env:
          KRATE_REQUIRE_E2E: "1"

      # NSIS is an x86 program; on Windows on ARM it runs emulated, and the
      # runner image may lack Chocolatey. makensis is optional there
      # (optional_tools): the smoke steps then skip the NSIS installer with a
      # notice.
      - name: Install NSIS and create a signing certificate (Windows)
        if: runner.os == 'Windows'
        continue-on-error: ${{ contains(matrix.optional_tools, 'makensis') }}
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Create a signing certificate (Windows)
        if: runner.os == 'Windows'
        run: node scripts/native-smoke.mjs windows cert
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, build and sign packages (Windows)
        if: runner.os == 'Windows'
        run: node scripts/native-smoke.mjs windows prepare
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, NSIS silent install, launch, uninstall (Windows)
        if: runner.os == 'Windows'
        run: node scripts/native-smoke.mjs windows nsis
        env:
          KRATE_REQUIRE_E2E: "1"

      # The installer's WebView2 check against the real registry, with a
      # stand-in bootstrapper (nothing is downloaded, the runner's runtime
      # registration is hidden only for the run and restored).
      - name: Packaging smoke test, NSIS WebView2 check (Windows)
        if: runner.os == 'Windows'
        run: node scripts/native-smoke.mjs windows webview2
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Packaging smoke test, MSIX validate, install, launch (Windows)
        if: runner.os == 'Windows'
        run: node scripts/native-smoke.mjs windows msix
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Update smoke test, 1.0.0 to 1.1.0 (Windows)
        if: runner.os == 'Windows'
        run: node scripts/native-smoke.mjs windows update

      # Memory of the system webview on real macOS and Windows machines. The
      # WKWebView and WebView2 memory levers were written without being able to
      # run them: this step produces the first numbers. `krate native profile --memory`
      # builds the app, measures PSS-equivalent and private memory per process
      # role against a blank-page floor and writes dist-native/report.json. The
      # profile comes from native.memory in krate.config.ts, set here per run
      # and restored afterwards.
      - name: Native memory report (macOS, Windows)
        if: runner.os != 'Linux'
        env:
          GOWORK: "off"
        run: |
          set -x
          EXE=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=".exe"; fi
          (cd packages/compiler && go build -o "$RUNNER_TEMP/krate$EXE" ./cmd/krate)
          app=examples/native-tasks
          cfg="$app/krate.config.ts"
          mkdir -p native-memory
          status=0
          for profile in balanced performance; do
            cp "$cfg" "$RUNNER_TEMP/krate.config.ts.orig"
            sed "s/native: {/native: { memory: '$profile',/" "$RUNNER_TEMP/krate.config.ts.orig" > "$cfg"
            "$RUNNER_TEMP/krate$EXE" native profile --memory --idle 10s "$app" || status=1
            mkdir -p "native-memory/$profile"
            cp "$app/dist-native/report.json" "native-memory/$profile/report.json" || status=1
            cp "$RUNNER_TEMP/krate.config.ts.orig" "$cfg"
          done
          exit $status

      # Compare the numbers above with the linux-amd64 limits in
      # packages/native/budgets.json. Informational: macOS and Windows budgets
      # stay "planned" until these numbers have been seen and reviewed.
      - name: Native memory budget comparison (macOS, Windows)
        if: always() && runner.os != 'Linux'
        continue-on-error: true
        run: |
          node scripts/native-budget-compare.mjs \
            "balanced=native-memory/balanced/report.json" \
            "performance=native-memory/performance/report.json"

      - name: Upload native memory reports
        if: always() && runner.os != 'Linux'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-memory-${{ matrix.os }}
          path: native-memory
          if-no-files-found: warn

      - name: Cache Playwright browsers
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install chromium
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec playwright install --with-deps chromium

      - name: Native end-to-end in the browser (chromium)
        if: matrix.os == 'ubuntu-latest'
        run: go test -p 1 -count=1 -timeout 20m -run 'TestNativeE2E|TestNativeDevSession|TestNativeRelease' -v ./internal/build
        working-directory: packages/compiler
        env:
          KRATE_BROWSER: chromium
          KRATE_REQUIRE_E2E: "1"

      # The slow packaging steps run last. Flatpak builds against the GNOME
      # runtime from Flathub (the smoke script installs it per user); the snap
      # is built in destructive mode on the runner and installed with --dangerous.
      - name: Install flatpak and flatpak-builder
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Packaging smoke test, Flatpak build, install, run (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a node scripts/native-smoke.mjs linux flatpak
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Install snapcraft
        if: matrix.os == 'ubuntu-latest'
        run: sudo snap install snapcraft --classic

      - name: Packaging smoke test, snap build, install, run (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a node scripts/native-smoke.mjs linux snap
        env:
          KRATE_REQUIRE_E2E: "1"
          KRATE_SNAP_DESTRUCTIVE: "1"

  node-versions:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24", "26"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Runtime sidecars and generateStaticParams
        run: go test ./internal/build -run 'TestActionSidecarTransport|TestExecuteGenerateStaticParamsRuntime' -count=1 -v
        working-directory: packages/compiler

  bun-deno:
    name: Bun and Deno runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Bun action sidecar and Deno static params
        run: go test ./internal/build -run 'TestActionSidecarTransport/bun|TestExecuteGenerateStaticParamsRuntime' -count=1 -v
        working-directory: packages/compiler

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Run benchmarks (informational)
        run: go test -run=^$ -bench=. -benchtime=200ms ./internal/lexer ./internal/parser ./internal/bundler ./internal/css ./internal/markdown ./internal/build
        working-directory: packages/compiler

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Fuzz lexer
        run: go test -fuzz=FuzzLexer -fuzztime=30s -run=^$ ./internal/lexer
        working-directory: packages/compiler

      - name: Fuzz parser
        run: go test -fuzz=FuzzParse -fuzztime=30s -run=^$ ./internal/parser
        working-directory: packages/compiler

      - name: Fuzz HTML minifier
        run: go test -fuzz=FuzzMinifyHTML -fuzztime=30s -run=^$ ./internal/build
        working-directory: packages/compiler

  browser-conformance:
    name: Browser conformance (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build JS packages
        run: pnpm -r --filter '!@krate/web' --filter '!@krate/benchmark' build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Browser conformance
        run: go test -run "TestBrowserConformance|TestTrimmedRuntimeBrowser" -count=1 -v ./internal/build
        working-directory: packages/compiler
        env:
          KRATE_BROWSER: ${{ matrix.browser }}
          KRATE_REQUIRE_E2E: "1"
          KRATE_HYDRATION_BUDGET_MS: "2500"

      - name: MCP browser tools
        if: matrix.browser == 'chromium'
        run: go test -run TestBrowserToolsDriveARealBrowser -count=1 ./internal/mcp
        working-directory: packages/compiler
        env:
          KRATE_BROWSER: ${{ matrix.browser }}

      # React 19 vs Krate differential over the R2/R3 corpus. Fails on any
      # divergence not listed in testdata/reactbrowser/divergences.json.
      - name: React browser differential
        run: go test -run 'TestReactBrowser' -count=1 -v ./internal/build
        working-directory: packages/compiler
        env:
          KRATE_BROWSER: ${{ matrix.browser }}
          KRATE_REQUIRE_E2E: "1"
          KRATE_REACT_EXIT: "1"
          KRATE_REACTBROWSER_REPORT: ${{ runner.temp }}/react-browser-${{ matrix.browser }}.txt

      # App-level browser tests: SPA router (layouts, templates, parallel and
      # intercepting routes), per-segment not-found and error pages, client
      # components inside server components, a migrated Next.js app (async
      # server components, revalidation), and code highlighting (light/dark
      # switching, code highlighted in the browser as it changes).
      - name: App browser tests
        run: go test -run 'TestRouterBrowserE2E|TestBasePathBrowser|TestSegmentPagesBrowser|TestServerlessNodeBrowser|TestUseClientIslandBrowser|TestMigratedNextAppBrowser|TestTailwindLayeringInBrowser|TestComponentsA11yBrowser|TestServerActionRedirectInBrowser|TestNoJSActionStateFeedbackInBrowser|TestCSPSpeculationRulesInBrowser|TestCodeThemeBrowser|TestDynamicCodeBrowser' -count=1 -v ./internal/build
        working-directory: packages/compiler
        env:
          KRATE_BROWSER: ${{ matrix.browser }}
          KRATE_REQUIRE_E2E: "1"

      - name: Upload React differential report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-browser-diff-${{ matrix.browser }}
          path: ${{ runner.temp }}/react-browser-${{ matrix.browser }}.txt
          if-no-files-found: ignore

  preact-conformance:
    name: Preact ${{ matrix.preact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preact: ["10.20.0", "10.24.0", "10.29.8"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build JS packages
        run: pnpm -r --filter '!@krate/web' --filter '!@krate/benchmark' build

      - name: Pin Preact
        run: pnpm --filter krate-examples add -D preact@${{ matrix.preact }}

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser conformance
        run: go test -run "TestBrowserConformance|TestTrimmedRuntimeBrowser" -count=1 -v ./internal/build
        working-directory: packages/compiler
        env:
          KRATE_BROWSER: chromium
          KRATE_REQUIRE_E2E: "1"
          KRATE_HYDRATION_BUDGET_MS: "2500"
