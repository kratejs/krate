name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      npm_config_frozen_lockfile: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      # Fails here, before any build, for a version npm cannot tag (1.0.0-1),
      # and keeps latest from moving backwards for a patch on an older line.
      - name: Determine npm dist-tag
        id: tag
        shell: bash
        run: node scripts/release-tag.mjs "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sync package versions
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build JS packages
        run: pnpm -r --filter "!@krate/web" --filter "!@krate/benchmark" build

      - name: TypeScript type-check
        run: pnpm run typecheck

      - name: JS unit tests
        run: pnpm run test:js

      - name: Build docs site
        run: pnpm --filter @krate/web build

      - name: Sync framework docs
        run: pnpm sync:docs

      # Gate the release on a green compiler so a broken build or stale embedded
      # docs can never be published.
      - name: Verify compiler
        working-directory: packages/compiler
        run: |
          go build ./...
          go vet ./...
          go test -race -gcflags=all=-d=checkptr=0 -p 2 -timeout 20m ./...
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Verify native module
        working-directory: packages/native
        run: |
          go build ./...
          go vet ./...
          go test -race -gcflags=all=-d=checkptr=0 -p 2 -timeout 20m ./...
        env:
          KRATE_REQUIRE_E2E: "1"

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser conformance
        working-directory: packages/compiler
        run: go test -run "TestBrowserConformance|TestTrimmedRuntimeBrowser" -count=1 -v ./internal/build
        env:
          KRATE_BROWSER: chromium
          KRATE_REQUIRE_E2E: "1"
          KRATE_HYDRATION_BUDGET_MS: "2500"

      - name: Check embedded docs are in sync
        run: node scripts/sync-krate-docs.mjs --check

      - name: Check compatibility matrix
        run: pnpm run check:matrix

      - name: Check roadmap and v1 gates
        run: pnpm run check:roadmap

      - name: Check package versions
        run: pnpm run check:version

      - name: Check release readiness
        run: pnpm run check:release

      - name: Generate platform packages
        run: node scripts/build-platform-packages.mjs

      # Re-run now that dist-platform/ exists, so the generated manifests are
      # checked too (no platform package may declare bin, and each holds
      # krate-shell next to krate).
      - name: Check generated platform packages
        run: pnpm run check:release

      # Every package carries the compiler and the Krate Native shell
      # (cross-compiled with CGO_ENABLED=0 from this Linux runner).
      - name: Report platform package sizes
        run: node scripts/report-platform-sizes.mjs

      # The step above leaves a dev binary in packages/core/bin. Publishing it
      # would make the wrapper run a non-executable, single-platform file.
      - name: Check @krate/core ships no compiler binary
        working-directory: packages/core
        run: |
          if npm pack --dry-run --json | grep -E '"path": "bin/krate(-shell)?(\.exe)?"'; then
            echo "@krate/core would publish a compiler binary" >&2
            exit 1
          fi

      - name: Install the release from its tarballs
        run: node scripts/smoke-install.mjs

      # Both steps skip a version that is already on npm, so a failed release
      # can be fixed and the job re-run instead of needing a new version.
      - name: Publish platform packages
        run: >-
          node scripts/publish-packages.mjs "${{ steps.tag.outputs.dist_tag }}"
          dist-platform/core-win32-x64 dist-platform/core-win32-arm64
          dist-platform/core-linux-x64 dist-platform/core-linux-x64-musl
          dist-platform/core-linux-arm64 dist-platform/core-darwin-x64
          dist-platform/core-darwin-arm64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # @krate/core goes last: its optional dependencies and @krate/plugin must
      # already exist when it is installable.
      - name: Publish npm packages
        run: >-
          node scripts/publish-packages.mjs "${{ steps.tag.outputs.dist_tag }}"
          packages/runtime packages/components packages/plugin packages/ts-plugin
          packages/base-docs-theme packages/simple-docs-theme
          packages/create-krate-app packages/create-krate-docs packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Compute compiler SDK changelog
        id: sdk
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          RVERSION="v${VERSION}"

          PREV_RELEASE="$(
            git tag -l 'v*' \
              | grep -v -x -F -- "${GITHUB_REF_NAME}" \
              | sort -V \
              | tail -n 1 || true
          )"
          echo "prev_release=${PREV_RELEASE}" >> "$GITHUB_OUTPUT"

          if [ -n "${PREV_RELEASE}" ]; then
            RANGE="${PREV_RELEASE}..HEAD"
          else
            RANGE="HEAD"
          fi

          # Every commit is a squash-merge, so list them all directly - no need
          # to resolve associated PRs via the GitHub API.
          : > /tmp/krate-entries.txt
          git log --no-merges --format='%H%x09%s' "${RANGE}" | while IFS=$'\t' read -r OID SUBJECT; do
            printf -- '- %s ([%s](https://github.com/%s/commit/%s))\n' "${SUBJECT}" "$(printf '%s' "$OID" | cut -c1-7)" "${GITHUB_REPOSITORY}" "${OID}" >> /tmp/krate-entries.txt
          done

          : > /tmp/grp-feat.txt
          : > /tmp/grp-fix.txt
          : > /tmp/grp-other.txt
          while IFS= read -r LINE; do
            case "${LINE}" in
              "- feat"*)  printf '%s\n' "${LINE}" >> /tmp/grp-feat.txt ;;
              "- fix"*)   printf '%s\n' "${LINE}" >> /tmp/grp-fix.txt ;;
              *)          printf '%s\n' "${LINE}" >> /tmp/grp-other.txt ;;
            esac
          done < /tmp/krate-entries.txt

          AUTHORS="$(git shortlog -sn "${RANGE}" || true)"
          DIFF_LINK=""
          if [ -n "${PREV_RELEASE}" ]; then
            PREV_SHA="$(git rev-parse "${PREV_RELEASE}")"
            DIFF_LINK="**Full diff:** [${PREV_RELEASE}...${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_SHA}...${GITHUB_SHA})"
          fi

          : > /tmp/pkg-list.txt
          {
            printf -- '- `@krate/core@%s`\n' "${VERSION}"
            printf -- '- `@krate/runtime@%s`\n' "${VERSION}"
            printf -- '- `@krate/components@%s`\n' "${VERSION}"
            printf -- '- `@krate/plugin@%s`\n' "${VERSION}"
            printf -- '- `@krate/ts-plugin@%s`\n' "${VERSION}"
            printf -- '- `@krate/base-docs-theme@%s`\n' "${VERSION}"
            printf -- '- `@krate/simple-docs-theme@%s`\n' "${VERSION}"
            printf -- '- `@krate/create-krate-app@%s`\n' "${VERSION}"
            printf -- '- `@krate/create-krate-docs@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-win32-x64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-win32-arm64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-linux-x64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-linux-x64-musl@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-linux-arm64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-darwin-x64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-darwin-arm64@%s`\n' "${VERSION}"
            printf -- '- Go module `github.com/kratejs/krate/packages/compiler@%s`\n' "${RVERSION}"
          } > /tmp/pkg-list.txt

          MAJOR="$(echo "${RVERSION}" | sed -E 's/^v?([0-9]+).*/\1/')"
          MODULE_PATH="github.com/kratejs/krate/packages/compiler"
          if [ "${MAJOR}" -gt 1 ] 2>/dev/null; then
            MODULE_PATH="${MODULE_PATH}/v${MAJOR}"
          fi

          {
            printf '## Released packages\n\n'
            cat /tmp/pkg-list.txt
            printf '\n---\n\n'
            printf '## Compiler SDK released %s\n\n' "${RVERSION}"
            printf 'The Go module `%s` is published at tag `packages/compiler/%s`.\n\n' "${MODULE_PATH}" "${RVERSION}"
            printf '```sh\ngo get %s@%s\n```\n\n' "${MODULE_PATH}" "${RVERSION}"
            printf '## Changelog\n\n'
            HAVE=false
            if [ -s /tmp/grp-feat.txt ]; then HAVE=true; printf '### Features\n\n'; cat /tmp/grp-feat.txt; printf '\n'; fi
            if [ -s /tmp/grp-fix.txt ]; then HAVE=true; printf '### Bug Fixes\n\n'; cat /tmp/grp-fix.txt; printf '\n'; fi
            if [ -s /tmp/grp-other.txt ]; then HAVE=true; printf '### Other Changes\n\n'; cat /tmp/grp-other.txt; printf '\n'; fi
            if [ "${HAVE}" = false ]; then printf -- '- No changes in this release.\n\n'; fi
            if [ -n "${AUTHORS}" ]; then
              printf '### Authors\n\n'
              echo "${AUTHORS}" | sed -E 's/^[[:space:]]*([0-9]+)[[:space:]]+(.*)$/- **\2** (\1 commits)/'
              printf '\n'
            fi
            if [ -n "${DIFF_LINK}" ]; then
              printf '%s\n\n' "${DIFF_LINK}"
            fi
            printf '\n---\n\n'
          } > compiler-sdk-notes.md

      - name: Tag Go module
        shell: bash
        run: |
          set -e
          VERSION="v${GITHUB_REF_NAME#v}"
          GO_TAG="packages/compiler/${VERSION}"
          if git rev-parse -q --verify "refs/tags/${GO_TAG}" >/dev/null; then
            echo "tag ${GO_TAG} already exists; skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${GO_TAG}" "${GITHUB_SHA}"
            git push origin "${GO_TAG}"
            echo "pushed ${GO_TAG}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; skipping"
            exit 0
          fi
          NOTES="$(mktemp)"
          cat compiler-sdk-notes.md > "${NOTES}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${GITHUB_REF_NAME}" \
            --jq .body >> "${NOTES}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Krate ${GITHUB_REF_NAME}" \
            --prerelease=${{ steps.tag.outputs.prerelease }} \
            --notes-file "${NOTES}"