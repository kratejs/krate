name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
        npm_config_frozen_lockfile: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Sync package versions
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Install JS dependencies
        # --no-frozen-lockfile: @krate/core's optional platform packages
        # (@krate/core-win32-x64, etc.) are published by THIS release, so the
        # committed lockfile can never contain them (pnpm omits unresolvable
        # optional deps). Frozen mode would therefore always fail here.
        run: pnpm install --no-frozen-lockfile

      - name: Build JS packages
        run: pnpm -r build

      - name: Generate platform packages
        run: node scripts/build-platform-packages.mjs

      - name: Publish platform packages
        run: |
          set -e
          for pkg in core-win32-x64 core-win32-arm64 core-linux-x64 core-linux-x64-musl core-linux-arm64 core-darwin-x64 core-darwin-arm64; do
            echo "Publishing @krate/$pkg..."
            (cd "dist-platform/$pkg" && pnpm publish --access public --no-git-checks)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish npm packages
        run: |
          set -e
          for dir in packages/runtime packages/components packages/core; do
            echo "Publishing $(basename "$dir")..."
            (cd "$dir" && pnpm publish --access public --no-git-checks)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
