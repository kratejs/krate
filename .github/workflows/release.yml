name: Release

# A release does not re-run the test suites. CI already ran them, in full, on
# the tagged commit (the push to dev or main that landed it); the ci-gate job
# requires that run to have passed, dispatches CI on the tag when the commit
# has none, and fails the release when it failed. What runs here is only what
# depends on the release version: the platform packages (one job each, in
# parallel), the version and package checks, the docs site build and the
# install smoke test of the exact tarballs that get published.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Fails here, before any build, for a version npm cannot tag (1.0.0-1), keeps
  # latest from moving backwards for a patch on an older line, and fails for a
  # package that is not on npm yet (trusted publishing cannot create one) with
  # the command that creates it.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      dist_tag: ${{ steps.tag.outputs.dist_tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Determine npm dist-tag
        id: tag
        shell: bash
        run: node scripts/release-tag.mjs "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check every package is on npm
        run: node scripts/publish-packages.mjs --check-registered

  # The compiler, native, browser and JS suites: a full CI run of this commit
  # must have passed (scripts/release-ci-gate.mjs).
  ci-gate:
    name: CI passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 160
    permissions:
      contents: read
      # Dispatches CI on the tag when the commit has no full run yet.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Wait for a green full CI run of this commit
        run: node scripts/release-ci-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # One job per platform package, so the seven cross-compiles run side by side
  # instead of one after another. The packages are tarred so the executable
  # bits survive the artifact upload.
  platforms:
    name: Platform package (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    env:
      npm_config_frozen_lockfile: "false"
    strategy:
      fail-fast: true
      matrix:
        pkg:
          - core-win32-x64
          - core-win32-arm64
          - core-linux-x64
          - core-linux-x64-musl
          - core-linux-arm64
          - core-darwin-x64
          - core-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache-dependency-path: packages/*/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Sync package versions
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      # set-version.mjs above rewrites the workspace versions, so the lockfile
      # no longer matches by design.
      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build JS packages
        run: pnpm -r --filter "!@krate/web" --filter "!@krate/benchmark" build

      - name: Sync framework docs
        run: pnpm sync:docs

      - name: Generate the platform package
        run: node scripts/build-platform-packages.mjs
        env:
          KRATE_ONLY_PLATFORM: ${{ matrix.pkg }}

      - name: Pack the platform package
        run: tar -C dist-platform -czf "${{ matrix.pkg }}.tgz" "${{ matrix.pkg }}"

      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.pkg }}
          path: ${{ matrix.pkg }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [preflight, ci-gate, platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: publishing exchanges the job's OIDC token for a
      # short-lived npm token. Each package trusts kratejs/krate release.yml on
      # npmjs.com (scripts/npm-trust.mjs; RELEASE.md, "Trusted publishing").
      id-token: write
    env:
      npm_config_frozen_lockfile: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache-dependency-path: packages/*/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Sync package versions
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      # set-version.mjs above rewrites the workspace versions, so the lockfile
      # no longer matches by design.
      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build JS packages
        run: pnpm -r --filter "!@krate/web" --filter "!@krate/benchmark" build

      # CI builds the site on pull requests through Cloudflare Pages, not in
      # this repository's checks, so the release keeps building it.
      - name: Build docs site
        run: pnpm --filter @krate/web build

      - name: Sync framework docs
        run: pnpm sync:docs

      - name: Check package versions
        run: pnpm run check:version

      - name: Check release readiness
        run: pnpm run check:release

      - name: Download the platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          merge-multiple: true
          path: platform-tarballs

      - name: Unpack the platform packages
        run: |
          mkdir -p dist-platform
          for f in platform-tarballs/*.tgz; do
            tar -C dist-platform -xzf "$f"
          done
          ls dist-platform

      # Re-run now that dist-platform/ exists, so the generated manifests are
      # checked too (no platform package may declare bin, and each holds
      # krate-shell next to krate).
      - name: Check generated platform packages
        run: pnpm run check:release

      # Every package carries the compiler and the Krate Native shell
      # (cross-compiled with CGO_ENABLED=0 on Linux runners).
      - name: Report platform package sizes
        run: node scripts/report-platform-sizes.mjs

      # A dev binary in packages/core/bin would make the wrapper run a
      # non-executable, single-platform file.
      - name: Check @krate/core ships no compiler binary
        working-directory: packages/core
        run: |
          if npm pack --dry-run --json | grep -E '"path": "bin/krate(-shell)?(\.exe)?"'; then
            echo "@krate/core would publish a compiler binary" >&2
            exit 1
          fi

      - name: Install the release from its tarballs
        run: node scripts/smoke-install.mjs

      # Both steps skip a version that is already on npm, so a failed release
      # can be fixed and the job re-run instead of needing a new version. They
      # publish through trusted publishing (OIDC, see permissions); pnpm falls
      # back to NODE_AUTH_TOKEN only for a package that does not trust this
      # workflow yet. npm stops accepting token publishes in January 2027.
      - name: Publish platform packages
        run: >-
          node scripts/publish-packages.mjs "${{ needs.preflight.outputs.dist_tag }}"
          dist-platform/core-win32-x64 dist-platform/core-win32-arm64
          dist-platform/core-linux-x64 dist-platform/core-linux-x64-musl
          dist-platform/core-linux-arm64 dist-platform/core-darwin-x64
          dist-platform/core-darwin-arm64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # @krate/core goes last: its optional dependencies and @krate/plugin must
      # already exist when it is installable.
      - name: Publish npm packages
        run: >-
          node scripts/publish-packages.mjs "${{ needs.preflight.outputs.dist_tag }}"
          packages/runtime packages/components packages/plugin packages/ts-plugin
          packages/base-docs-theme packages/simple-docs-theme packages/auth packages/three packages/konva
          packages/app packages/create-krate-app packages/create-krate-docs packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Compute compiler SDK changelog
        id: sdk
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          RVERSION="v${VERSION}"

          PREV_RELEASE="$(
            git tag -l 'v*' \
              | grep -v -x -F -- "${GITHUB_REF_NAME}" \
              | sort -V \
              | tail -n 1 || true
          )"
          echo "prev_release=${PREV_RELEASE}" >> "$GITHUB_OUTPUT"

          if [ -n "${PREV_RELEASE}" ]; then
            RANGE="${PREV_RELEASE}..HEAD"
          else
            RANGE="HEAD"
          fi

          # Every commit is a squash-merge, so list them all directly - no need
          # to resolve associated PRs via the GitHub API.
          : > /tmp/krate-entries.txt
          git log --no-merges --format='%H%x09%s' "${RANGE}" | while IFS=$'\t' read -r OID SUBJECT; do
            printf -- '- %s ([%s](https://github.com/%s/commit/%s))\n' "${SUBJECT}" "$(printf '%s' "$OID" | cut -c1-7)" "${GITHUB_REPOSITORY}" "${OID}" >> /tmp/krate-entries.txt
          done

          : > /tmp/grp-feat.txt
          : > /tmp/grp-fix.txt
          : > /tmp/grp-other.txt
          while IFS= read -r LINE; do
            case "${LINE}" in
              "- feat"*)  printf '%s\n' "${LINE}" >> /tmp/grp-feat.txt ;;
              "- fix"*)   printf '%s\n' "${LINE}" >> /tmp/grp-fix.txt ;;
              *)          printf '%s\n' "${LINE}" >> /tmp/grp-other.txt ;;
            esac
          done < /tmp/krate-entries.txt

          AUTHORS="$(git shortlog -sn "${RANGE}" || true)"
          DIFF_LINK=""
          if [ -n "${PREV_RELEASE}" ]; then
            PREV_SHA="$(git rev-parse "${PREV_RELEASE}")"
            DIFF_LINK="**Full diff:** [${PREV_RELEASE}...${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_SHA}...${GITHUB_SHA})"
          fi

          : > /tmp/pkg-list.txt
          {
            printf -- '- `@krate/core@%s`\n' "${VERSION}"
            printf -- '- `@krate/runtime@%s`\n' "${VERSION}"
            printf -- '- `@krate/components@%s`\n' "${VERSION}"
            printf -- '- `@krate/plugin@%s`\n' "${VERSION}"
            printf -- '- `@krate/ts-plugin@%s`\n' "${VERSION}"
            printf -- '- `@krate/base-docs-theme@%s`\n' "${VERSION}"
            printf -- '- `@krate/simple-docs-theme@%s`\n' "${VERSION}"
            printf -- '- `@krate/auth@%s`\n' "${VERSION}"
            printf -- '- `@krate/three@%s`\n' "${VERSION}"
            printf -- '- `@krate/konva@%s`\n' "${VERSION}"
            printf -- '- `@krate/app@%s`\n' "${VERSION}"
            printf -- '- `create-krate-app@%s`\n' "${VERSION}"
            printf -- '- `create-krate-docs@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-win32-x64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-win32-arm64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-linux-x64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-linux-x64-musl@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-linux-arm64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-darwin-x64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-darwin-arm64@%s`\n' "${VERSION}"
            printf -- '- Go module `github.com/kratejs/krate/packages/compiler@%s`\n' "${RVERSION}"
          } > /tmp/pkg-list.txt

          MAJOR="$(echo "${RVERSION}" | sed -E 's/^v?([0-9]+).*/\1/')"
          MODULE_PATH="github.com/kratejs/krate/packages/compiler"
          if [ "${MAJOR}" -gt 1 ] 2>/dev/null; then
            MODULE_PATH="${MODULE_PATH}/v${MAJOR}"
          fi

          {
            printf '## Released packages\n\n'
            cat /tmp/pkg-list.txt
            printf '\n---\n\n'
            printf '## Compiler SDK released %s\n\n' "${RVERSION}"
            printf 'The Go module `%s` is published at tag `packages/compiler/%s`.\n\n' "${MODULE_PATH}" "${RVERSION}"
            printf '```sh\ngo get %s@%s\n```\n\n' "${MODULE_PATH}" "${RVERSION}"
            printf '## Changelog\n\n'
            HAVE=false
            if [ -s /tmp/grp-feat.txt ]; then HAVE=true; printf '### Features\n\n'; cat /tmp/grp-feat.txt; printf '\n'; fi
            if [ -s /tmp/grp-fix.txt ]; then HAVE=true; printf '### Bug Fixes\n\n'; cat /tmp/grp-fix.txt; printf '\n'; fi
            if [ -s /tmp/grp-other.txt ]; then HAVE=true; printf '### Other Changes\n\n'; cat /tmp/grp-other.txt; printf '\n'; fi
            if [ "${HAVE}" = false ]; then printf -- '- No changes in this release.\n\n'; fi
            if [ -n "${AUTHORS}" ]; then
              printf '### Authors\n\n'
              echo "${AUTHORS}" | sed -E 's/^[[:space:]]*([0-9]+)[[:space:]]+(.*)$/- **\2** (\1 commits)/'
              printf '\n'
            fi
            if [ -n "${DIFF_LINK}" ]; then
              printf '%s\n\n' "${DIFF_LINK}"
            fi
            printf '\n---\n\n'
          } > compiler-sdk-notes.md

      - name: Tag Go module
        shell: bash
        run: |
          set -e
          VERSION="v${GITHUB_REF_NAME#v}"
          GO_TAG="packages/compiler/${VERSION}"
          if git rev-parse -q --verify "refs/tags/${GO_TAG}" >/dev/null; then
            echo "tag ${GO_TAG} already exists; skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${GO_TAG}" "${GITHUB_SHA}"
            git push origin "${GO_TAG}"
            echo "pushed ${GO_TAG}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; skipping"
            exit 0
          fi
          NOTES="$(mktemp)"
          cat compiler-sdk-notes.md > "${NOTES}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${GITHUB_REF_NAME}" \
            --jq .body >> "${NOTES}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Krate ${GITHUB_REF_NAME}" \
            --prerelease=${{ needs.preflight.outputs.prerelease }} \
            --notes-file "${NOTES}"