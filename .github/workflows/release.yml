name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      npm_config_frozen_lockfile: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Determine npm dist-tag
        id: tag
        shell: bash
        run: |
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" == *"-"* ]]; then
            # Takes everything after the first '-' and strips trailing dots/numbers
            PRERELEASE_STR="${VERSION#*-}"
            TAG_NAME="${PRERELEASE_STR%%.*}"
            echo "dist_tag=${TAG_NAME:-beta}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            else
            echo "dist_tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            fi

      - name: Sync package versions
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build JS packages
        run: pnpm -r --filter "!@krate/web" --filter "!@krate/benchmark" build

      - name: Generate platform packages
        run: node scripts/build-platform-packages.mjs

      - name: Publish platform packages
        run: |
          set -e
          for pkg in core-win32-x64 core-win32-arm64 core-linux-x64 core-linux-x64-musl core-linux-arm64 core-darwin-x64 core-darwin-arm64; do
            echo "Publishing @krate/$pkg with tag ${{ steps.tag.outputs.dist_tag }}..."
            (cd "dist-platform/$pkg" && pnpm publish --access public --no-git-checks --tag "${{ steps.tag.outputs.dist_tag }}")
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish npm packages
        run: |
          set -e
          for dir in packages/runtime packages/components packages/core packages/plugin packages/create-krate-app packages/create-krate-docs; do
            echo "Publishing $(basename "$dir") with tag ${{ steps.tag.outputs.dist_tag }}..."
            (cd "$dir" && pnpm publish --access public --no-git-checks --tag "${{ steps.tag.outputs.dist_tag }}")
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Compute compiler SDK changelog
        id: sdk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          RVERSION="v${VERSION}"
          REPO_OWNER="${GITHUB_REPOSITORY%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          PREV_RELEASE="$(
            git tag -l 'v*' \
              | grep -v -x -F -- "${GITHUB_REF_NAME}" \
              | sort -V \
              | tail -n 1 || true
          )"
          PREV_COMPILER="$(
            git tag -l 'packages/compiler/v*' \
              | grep -v -F -- "packages/compiler/${RVERSION}" \
              | sort -V \
              | tail -n 1 || true
          )"
          echo "prev_release=${PREV_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "prev_compiler=${PREV_COMPILER:-NONE}" >> "$GITHUB_OUTPUT"

          if [ -n "${PREV_RELEASE}" ]; then
            RANGE="${PREV_RELEASE}..HEAD"
          else
            RANGE="HEAD"
          fi

          SHAS="$(git log --no-merges --format='%H' "${RANGE}")"
          : > /tmp/krate-sha-set.txt
          printf '%s\n' "${SHAS}" > /tmp/krate-sha-set.txt
          OLDEST="$(tail -n 1 /tmp/krate-sha-set.txt || true)"
          TOTAL_SHAS="$(printf '%s' "${SHAS}" | grep -c '^' || true)"

          : > /tmp/krate-nodes.tsv
          if [ "${TOTAL_SHAS}" -gt 0 ]; then
            QUERY='query($owner:String!,$repo:String!,$oid:GitObjectID!,$cursor:String){ repository(owner:$owner,name:$repo){ object(oid:$oid){ ... on Commit { history(first:100,after:$cursor){ pageInfo{ hasNextPage endCursor } nodes{ oid messageHeadline associatedPullRequests(first:1){ nodes{ number title url } } } } } } } }'
            CURSOR=""
            REACHED=false
            while :; do
              # The cursor must be omitted on the first page: GitHub rejects an
              # explicit empty `after` cursor ("" is not a valid cursor).
              API_ARGS=(api graphql -f query="$QUERY" -F owner="$REPO_OWNER" -F repo="$REPO_NAME" -F oid="$GITHUB_SHA")
              if [ -n "${CURSOR}" ]; then
                API_ARGS+=(-f cursor="$CURSOR")
              fi
              RESPONSE="$(gh "${API_ARGS[@]}")"
              echo "$RESPONSE" \
                | jq -r '.data.repository.object.history.nodes[] | [.oid, .messageHeadline, (.associatedPullRequests.nodes[0].number // ""), (.associatedPullRequests.nodes[0].title // ""), (.associatedPullRequests.nodes[0].url // "")] | @tsv' \
                >> /tmp/krate-nodes.tsv
              if [ -n "${OLDEST}" ]; then
                # OLDEST is a bare SHA; the TSV's first column is the oid, so
                # compare against column 1 (a bare-SHA grep can never match a
                # full TSV line and pagination would never stop early).
                cut -f1 /tmp/krate-nodes.tsv | grep -qxF -- "${OLDEST}" && REACHED=true
              fi
              HAS_NEXT="$(echo "$RESPONSE" | jq -r '.data.repository.object.history.pageInfo.hasNextPage')"
              CURSOR="$(echo "$RESPONSE" | jq -r '.data.repository.object.history.pageInfo.endCursor')"
              if [ "${REACHED}" = true ] || [ "${HAS_NEXT}" != "true" ] || [ -z "${CURSOR}" ]; then
                break
              fi
            done
          fi

          : > /tmp/krate-entries.txt
          : > /tmp/krate-seen-pr.txt
          while IFS=$'\t' read -r OID HEADLINE PRNUM PRTITLE PRURL; do
            grep -qxF -- "${OID}" /tmp/krate-sha-set.txt || continue
            if [ -n "${PRNUM}" ]; then
              if grep -qxF -- "${PRNUM}" /tmp/krate-seen-pr.txt; then
                continue
              fi
              printf '%s\n' "${PRNUM}" >> /tmp/krate-seen-pr.txt
              printf -- '- %s ([#%s](%s))\n' "${PRTITLE}" "${PRNUM}" "${PRURL}" >> /tmp/krate-entries.txt
            else
              printf -- '- %s ([%s](https://github.com/%s/commit/%s))\n' "${HEADLINE}" "$(printf '%s' "$OID" | cut -c1-7)" "${GITHUB_REPOSITORY}" "${OID}" >> /tmp/krate-entries.txt
            fi
          done < /tmp/krate-nodes.tsv

          : > /tmp/grp-feat.txt
          : > /tmp/grp-fix.txt
          : > /tmp/grp-other.txt
          while IFS= read -r LINE; do
            case "${LINE}" in
              "- feat"*)  printf '%s\n' "${LINE}" >> /tmp/grp-feat.txt ;;
              "- fix"*)   printf '%s\n' "${LINE}" >> /tmp/grp-fix.txt ;;
              *)          printf '%s\n' "${LINE}" >> /tmp/grp-other.txt ;;
            esac
          done < /tmp/krate-entries.txt

          AUTHORS="$(git shortlog -sn "${RANGE}" || true)"
          DIFF_LINK=""
          if [ -n "${PREV_RELEASE}" ]; then
            PREV_SHA="$(git rev-parse "${PREV_RELEASE}")"
            DIFF_LINK="**Full diff:** [${PREV_RELEASE}...${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_SHA}...${GITHUB_SHA})"
          fi

          : > /tmp/pkg-list.txt
          {
            printf -- '- `@krate/core@%s`\n' "${VERSION}"
            printf -- '- `@krate/runtime@%s`\n' "${VERSION}"
            printf -- '- `@krate/components@%s`\n' "${VERSION}"
            printf -- '- `@krate/plugin@%s`\n' "${VERSION}"
            printf -- '- `@krate/create-krate-app@%s`\n' "${VERSION}"
            printf -- '- `@krate/create-krate-docs@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-win32-x64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-win32-arm64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-linux-x64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-linux-x64-musl@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-linux-arm64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-darwin-x64@%s`\n' "${VERSION}"
            printf -- '- `@krate/core-darwin-arm64@%s`\n' "${VERSION}"
            printf -- '- Go module `github.com/kratejs/krate/packages/compiler@%s`\n' "${RVERSION}"
          } > /tmp/pkg-list.txt

          MAJOR="$(echo "${RVERSION}" | sed -E 's/^v?([0-9]+).*/\1/')"
          MODULE_PATH="github.com/kratejs/krate/packages/compiler"
          if [ "${MAJOR}" -gt 1 ] 2>/dev/null; then
            MODULE_PATH="${MODULE_PATH}/v${MAJOR}"
          fi

          {
            printf '## Released packages\n\n'
            cat /tmp/pkg-list.txt
            printf '\n---\n\n'
            printf '## Compiler SDK released %s\n\n' "${RVERSION}"
            printf 'The Go module `%s` is published at tag `packages/compiler/%s`.\n\n' "${MODULE_PATH}" "${RVERSION}"
            printf '```sh\ngo get %s@%s\n```\n\n' "${MODULE_PATH}" "${RVERSION}"
            printf '## Changelog\n\n'
            HAVE=false
            if [ -s /tmp/grp-feat.txt ]; then HAVE=true; printf '### Features\n\n'; cat /tmp/grp-feat.txt; printf '\n'; fi
            if [ -s /tmp/grp-fix.txt ]; then HAVE=true; printf '### Bug Fixes\n\n'; cat /tmp/grp-fix.txt; printf '\n'; fi
            if [ -s /tmp/grp-other.txt ]; then HAVE=true; printf '### Other Changes\n\n'; cat /tmp/grp-other.txt; printf '\n'; fi
            if [ "${HAVE}" = false ]; then printf -- '- No changes in this release.\n\n'; fi
            if [ -n "${AUTHORS}" ]; then
              printf '### Authors\n\n'
              echo "${AUTHORS}" | sed -E 's/^[[:space:]]*([0-9]+)[[:space:]]+(.*)$/- **\2** (\1 commits)/'
              printf '\n'
            fi
            if [ -n "${DIFF_LINK}" ]; then
              printf '%s\n\n' "${DIFF_LINK}"
            fi
            printf '\n---\n\n'
          } > compiler-sdk-notes.md

      - name: Tag Go module
        shell: bash
        run: |
          set -e
          VERSION="v${GITHUB_REF_NAME#v}"
          GO_TAG="packages/compiler/${VERSION}"
          if git rev-parse -q --verify "refs/tags/${GO_TAG}" >/dev/null; then
            echo "tag ${GO_TAG} already exists; skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${GO_TAG}" "${GITHUB_SHA}"
            git push origin "${GO_TAG}"
            echo "pushed ${GO_TAG}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; skipping"
            exit 0
          fi
          NOTES="$(mktemp)"
          cat compiler-sdk-notes.md > "${NOTES}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${GITHUB_REF_NAME}" \
            --jq .body >> "${NOTES}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Krate ${GITHUB_REF_NAME}" \
            --prerelease=${{ steps.tag.outputs.prerelease }} \
            --notes-file "${NOTES}"