name: Native benchmark

# Krate Native against Electron and Tauri on the same small app: cold start,
# idle memory, installer size and size on disk. Informational only: nothing
# here gates a merge. The numbers are in the job summary and in the
# native-bench-* artifacts. Method: docs/native/benchmarks.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per app
        default: "5"
      idle:
        description: Seconds between the first paint and the memory sample
        default: "5"
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - packages/benchmark/native/**
      - packages/native/cmd/krate-memtree/**
      - packages/native/memstat/**
      - .github/workflows/native-bench.yml

concurrency:
  group: native-bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: Bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GOFLAGS: -modcacherw
      RUNS: ${{ inputs.runs || '5' }}
      IDLE: ${{ inputs.idle || '5' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/compiler/go.mod
          cache: true

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # Tauri compiles Rust. The runners ship rustup; make sure stable is the
      # active toolchain.
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo (Tauri)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/benchmark/native/tauri/src-tauri/target
          key: native-bench-cargo-${{ runner.os }}-${{ hashFiles('packages/benchmark/native/tauri/src-tauri/Cargo.lock') }}

      # Tauri needs the WebKitGTK and GTK development files; Krate needs the
      # runtime library. Xvfb gives the apps a display.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf file rpm fakeroot dpkg

      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/appimagetool.AppImage" "https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-$(uname -m).AppImage"
          chmod +x "$HOME/bin/appimagetool.AppImage"
          printf '#!/bin/sh\nAPPIMAGE_EXTRACT_AND_RUN=1 exec "%s/bin/appimagetool.AppImage" "$@"\n' "$HOME" > "$HOME/bin/appimagetool"
          chmod +x "$HOME/bin/appimagetool"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v makensis >/dev/null 2>&1; then
            choco install nsis -y --no-progress
          fi
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      # @krate/core, @krate/runtime and @krate/app are linked into the Krate
      # app by the harness, so they must be built.
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync framework docs
        run: node scripts/sync-krate-docs.mjs

      - name: Build JS packages
        run: pnpm -r --filter '!@krate/web' --filter '!@krate/benchmark' build

      - name: Harness unit tests
        run: node --test packages/benchmark/native/bench.test.mjs

      - name: Benchmark (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" node packages/benchmark/native/bench.mjs --runs "$RUNS" --idle "$IDLE" --out "$RUNNER_TEMP/native-bench"

      - name: Benchmark (macOS, Windows)
        if: runner.os != 'Linux'
        run: node packages/benchmark/native/bench.mjs --runs "$RUNS" --idle "$IDLE" --out "$RUNNER_TEMP/native-bench"

      - name: Job summary
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/native-bench/native-bench-*.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-bench-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native-bench/native-bench-*.json
            ${{ runner.temp }}/native-bench/native-bench-*.md
            ${{ runner.temp }}/native-bench/work/*.log
          if-no-files-found: warn
